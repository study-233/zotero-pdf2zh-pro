name: Build Windows release
run-name: Build v${{ inputs.version }} at ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already committed (for example 1.6.0)
        required: true
        type: string
      commit:
        description: Full 40-character commit SHA containing this version
        required: true
        type: string
      full_validation:
        description: Additional Windows rollback, relocation and previous-release migration; core CI is reused
        required: false
        type: boolean
        default: false
      replacement_commit:
        description: Explicit original release commit for same-version replacement with unchanged PyPI sources
        required: false
        type: string
      reuse_build_run_id:
        description: Optional prior run whose artifact build succeeded; reuse its packages for the selected validation
        required: false
        type: string
      validation_run_id:
        description: Optional run whose standard tests all passed but final collection failed; resume collection with unchanged test scripts
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: build-windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      REPLACEMENT_COMMIT: ${{ inputs.replacement_commit }}
      REUSE_BUILD_RUN_ID: ${{ inputs.reuse_build_run_id }}
      VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
      GH_TOKEN: ${{ github.token }}
      UV_DEFAULT_INDEX: https://pypi.org/simple
      PDF2ZH_WINDOWS_PORT: "18890"
    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'Release builds must be dispatched from main' }
          if ($env:RELEASE_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected stable semver' }
          if ($env:RELEASE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected full lowercase commit SHA' }
          if ($env:REPLACEMENT_COMMIT -and $env:REPLACEMENT_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected full original replacement commit SHA' }
          if ($env:REPLACEMENT_COMMIT -and '${{ inputs.full_validation }}' -ne 'true') { throw 'Same-version replacement requires full validation' }
          $reuse = $env:REUSE_BUILD_RUN_ID
          if ($reuse -and $reuse -cnotmatch '^[0-9]+$') { throw 'Expected numeric prior run ID' }
          $validation = $env:VALIDATION_RUN_ID
          if ($validation -and ($validation -cnotmatch '^[0-9]+$' -or -not $reuse -or '${{ inputs.full_validation }}' -eq 'true' -or $env:REPLACEMENT_COMMIT)) { throw 'Collection recovery requires a build run and standard validation only' }
          git config --global core.autocrlf false

      - name: Checkout trusted workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source before using caches or target scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - "$GITHUB_REF" "$RELEASE_COMMIT" "$GITHUB_SHA" <<'PY_SOURCE'
          import re, subprocess, sys
          assert sys.argv[1] == "refs/heads/main", "Dispatch must use main"
          assert re.fullmatch("[0-9a-f]{40}", sys.argv[2]), "Expected a full commit SHA"
          subprocess.run(["git", "merge-base", "--is-ancestor", sys.argv[2], sys.argv[3]], check=True)
          PY_SOURCE

      - name: Require successful core CI for the release commit
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_COMMIT&status=success&per_page=100" > "$RUNNER_TEMP/core-ci.json"
          python - "$RUNNER_TEMP/core-ci.json" "$RELEASE_COMMIT" <<'PY_CORE'
          import json, sys
          from pathlib import Path
          runs = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["workflow_runs"]
          assert any(r["head_sha"] == sys.argv[2] and r["conclusion"] == "success"
                     and r["event"] == "push" for r in runs), "Release commit must pass core CI first"
          PY_CORE
          # Use the trusted tool verifier even when building a historical release.
          mkdir -p "$RUNNER_TEMP/renderer-harness"
          cp scripts/prepare_windows_build_tools.ps1 scripts/prepare_windows_skia_source.py scripts/prepare_windows_skia_dependencies.py "$RUNNER_TEMP/renderer-harness/"

      - name: Prepare temporary local main and isolated test paths
        shell: bash
        run: |
          set -euo pipefail
          git switch -C main "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Configure isolated Windows installation
        shell: pwsh
        run: |
          # Avoid runner profile 8.3 aliases so temporary-path assertions use canonical paths.
          $testTemp = Join-Path $env:RUNNER_TEMP 'pdf2zh-tests-temp'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "TMPDIR=$($testTemp.Replace('\', '/'))" >> $env:GITHUB_ENV
          "UV_TOOL_DIR=$env:RUNNER_TEMP\uv-tools" >> $env:GITHUB_ENV
          "UV_TOOL_BIN_DIR=$env:RUNNER_TEMP\uv-bin" >> $env:GITHUB_ENV
          "PDF2ZH_WINDOWS_APP_ROOT=$env:RUNNER_TEMP\zotero-pdf2zh-pro 中文 with spaces" >> $env:GITHUB_ENV
          "PDF2ZH_WINDOWS_REGISTRY_KEY=HKCU:\Software\zotero-pdf2zh-pro-ci-$env:GITHUB_RUN_ID" >> $env:GITHUB_ENV
          "PDF2ZH_WINDOWS_START_MENU_DIR=$env:RUNNER_TEMP\start-menu\zotero-pdf2zh-pro" >> $env:GITHUB_ENV
          "PDF2ZH_DATA_DIR=$env:RUNNER_TEMP\server-test-data" >> $env:GITHUB_ENV

      - name: Setup Node.js
        if: inputs.reuse_build_run_id == ''
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        if: inputs.reuse_build_run_id == ''
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup uv and Python 3.13
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: windows-release

      - name: Setup Rust
        if: inputs.reuse_build_run_id == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        if: inputs.reuse_build_run_id == ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app
          # A failed pre-build check must not permanently occupy a dependency
          # cache key with an incomplete target directory.
          cache-on-failure: false
          shared-key: windows-release

      - name: Cache verified Windows renderer archives
        id: renderer-cache
        if: inputs.reuse_build_run_id == ''
        uses: actions/cache@v4
        with:
          path: .tmp/cache/windows-build-archives
          key: windows-release-slint-1.18.1-skia-153-llvm-21.1.8-archives-v2

      - name: Prepare static Slint renderer toolchain
        id: renderer-tools
        if: inputs.reuse_build_run_id == ''
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/renderer-harness/prepare_windows_build_tools.ps1" -CacheRoot "$env:GITHUB_WORKSPACE/.tmp/cache/windows-build-archives"

      - name: Use a short Windows build path
        if: inputs.reuse_build_run_id == ''
        shell: pwsh
        run: |
          if (Test-Path 'P:\') { throw 'The isolated build drive is already occupied' }
          subst.exe P: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'PDF2ZH_WINDOWS_BUILD_ROOT=P:\' >> $env:GITHUB_ENV

      - name: Verify committed versions
        shell: bash
        run: uv run --no-project python scripts/check_release_artifacts.py "$RELEASE_VERSION" "$RELEASE_COMMIT"

      - name: Build artifacts and verify Windows startup
        if: inputs.reuse_build_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          args=("$RELEASE_VERSION" --no-push)
          if [[ -n "$REPLACEMENT_COMMIT" ]]; then
            args+=(--replace-existing "$REPLACEMENT_COMMIT")
          fi
          bash scripts/release.sh "${args[@]}"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Restore packages from a completed artifact build
        if: inputs.reuse_build_run_id != ''
        shell: bash
        env:
          REUSE_RUN: ${{ inputs.reuse_build_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" > "$RUNNER_TEMP/reuse-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN/jobs?filter=latest" > "$RUNNER_TEMP/reuse-jobs.json"
          python - "$RUNNER_TEMP/reuse-run.json" "$RUNNER_TEMP/reuse-jobs.json" "$RELEASE_COMMIT" <<'PY_RUN'
          import json, sys
          from pathlib import Path
          run, jobs = [json.loads(Path(p).read_text(encoding="utf-8")) for p in sys.argv[1:3]]
          assert run["head_sha"] == sys.argv[3] and run["status"] == "completed"
          assert run["path"] == ".github/workflows/build-windows-release.yml"
          assert any(s["name"] == "Build artifacts and verify Windows startup" and s["conclusion"] == "success"
                     for j in jobs["jobs"] for s in j.get("steps", []))
          PY_RUN
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" --jq '.conclusion')"
          prefix=failed-release
          [[ "$conclusion" == success ]] && prefix=release
          gh run download "$REUSE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$prefix-$RELEASE_VERSION-$RELEASE_COMMIT" --dir "$RUNNER_TEMP/reuse-build"
          python - "$RUNNER_TEMP/reuse-build" "$RELEASE_VERSION" <<'PY_COPY'
          import shutil, sys
          from pathlib import Path
          source, version = Path(sys.argv[1]), sys.argv[2]
          product = "zotero-pdf2zh-pro"
          paths = [f"plugin/build/{product}.xpi", "plugin/build/update.json",
                   f"dist/{product}-windows-x64.zip", f"dist/{product}-windows-x64-setup.exe", "dist/windows-update.json",
                   f"dist/{product}-{version}-source.zip",
                   f"server/dist/zotero_pdf2zh_pro-{version}-py3-none-any.whl",
                   f"server/dist/zotero_pdf2zh_pro-{version}.tar.gz"]
          matches = [(Path(p), list(source.rglob(Path(p).name))) for p in paths]
          assert all(len(found) == 1 for _, found in matches), "Missing or ambiguous build artifact"
          for target, found in matches:
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(found[0], target)
          PY_COPY
          uv run --no-project python scripts/check_pypi_artifacts.py server/dist "$RELEASE_VERSION"
          uv run --no-project python scripts/check_release_artifacts.py "$RELEASE_VERSION" "$RELEASE_COMMIT" --collect

      - name: Verify completed standard validation before collection recovery
        if: inputs.validation_run_id != ''
        shell: bash
        env:
          VALIDATION_RUN: ${{ inputs.validation_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN" > "$RUNNER_TEMP/validation-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN/jobs?filter=latest" > "$RUNNER_TEMP/validation-jobs.json"
          python - "$RUNNER_TEMP/validation-run.json" "$RUNNER_TEMP/validation-jobs.json" "$RELEASE_COMMIT" "$RELEASE_VERSION" "$GITHUB_SHA" <<'PY_VALIDATION'
          import json, subprocess, sys
          from pathlib import Path
          run, jobs = [json.loads(Path(p).read_text(encoding="utf-8")) for p in sys.argv[1:3]]
          assert run["status"] == "completed" and run["conclusion"] == "failure"
          assert run["path"] == ".github/workflows/build-windows-release.yml"
          assert run["display_title"] == f"Build v{sys.argv[4]} at {sys.argv[3]}"
          build = [job for job in jobs["jobs"] if job["name"] == "build"]
          assert len(build) == 1
          steps = {step["name"]: step["conclusion"] for step in build[0]["steps"]}
          for name in ["Verify committed versions", "Require successful core CI for the release commit",
                       "Restore packages from a completed artifact build", "Use current test harness for reused artifacts",
                       "Fresh installed Python 3.13 runtime and OCR", "Verify installed startup and upgrade",
                       "Verify real downloads and progress with the release controller"]:
              assert steps.get(name) == "success", f"Missing passed validation: {name}"
          assert steps.get("Verify and collect release artifacts") == "failure"
          subprocess.run(["git", "merge-base", "--is-ancestor", sys.argv[3], run["head_sha"]], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", run["head_sha"], sys.argv[5]], check=True)
          paths = ["check_installed_runtime.py", "test_windows_lifecycle.ps1", "check_windows_background.py",
                   "test_windows_process_helpers.ps1", "test_windows_release_extended.ps1",
                   "test_windows_previous_release.ps1", "test_windows_update_reuse.ps1", "test_windows_uv_progress.py",
                   "workspace.py", "workspace.ps1"]
          subprocess.run(["git", "diff", "--exit-code", run["head_sha"], sys.argv[5], "--",
                          *["scripts/" + path for path in paths]], check=True)
          PY_VALIDATION
          echo 'REUSE_VALIDATION=true' >> "$GITHUB_ENV"

      - name: Use current test harness for reused artifacts
        if: inputs.reuse_build_run_id != '' && env.REUSE_VALIDATION != 'true'
        shell: bash
        run: |
          # Only the test harness comes from this workflow's newer revision.
          # Product sources, packages and their provenance stay at RELEASE_COMMIT.
          git restore --source "$GITHUB_SHA" --worktree -- \
            scripts/test_windows_lifecycle.ps1 scripts/check_windows_background.py \
            scripts/test_windows_process_helpers.ps1 scripts/test_windows_release_extended.ps1 \
            scripts/test_windows_previous_release.ps1 scripts/test_windows_update_reuse.ps1 \
            scripts/test_windows_uv_progress.py scripts/workspace.py scripts/workspace.ps1

      - name: Fresh installed Python 3.13 runtime and OCR
        if: env.REUSE_VALIDATION != 'true'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'release-runtime'
          uv venv --python 3.13 $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          $wheel = "server/dist/zotero_pdf2zh_pro-$env:RELEASE_VERSION-py3-none-any.whl"
          uv pip install --python $python $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/check_installed_runtime.py $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed startup and upgrade
        if: env.REUSE_VALIDATION != 'true'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'PowerShell 5.1 is required' }
          $wheel = (Resolve-Path "server/dist/zotero_pdf2zh_pro-$env:RELEASE_VERSION-py3-none-any.whl").Path
          $smokeOnly = '${{ inputs.full_validation }}' -ne 'true'
          & scripts/test_windows_lifecycle.ps1 -WindowsPackage 'dist/zotero-pdf2zh-pro-windows-x64.zip' -PackageSource $wheel -SmokeOnly:$smokeOnly

      - name: Verify real downloads and progress with the release controller
        if: env.REUSE_VALIDATION != 'true'
        shell: pwsh
        run: |
          $progressPackage = Join-Path $env:RUNNER_TEMP 'progress-package'
          Expand-Archive -LiteralPath 'dist/zotero-pdf2zh-pro-windows-x64.zip' -DestinationPath $progressPackage
          $env:PDF2ZH_TEST_CONTROL = Join-Path $progressPackage 'zotero-pdf2zh-pro.exe'
          $env:PDF2ZH_TEST_UV = (Get-Command uv).Source
          $env:PDF2ZH_TEST_PYTHON = (uv python find 3.13 | Out-String).Trim()
          uv run --no-project python scripts/test_windows_uv_progress.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify v1.8.2 migration and locked dependency reuse
        if: inputs.full_validation && inputs.replacement_commit == ''
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_windows_release_extended.ps1 -Version $env:RELEASE_VERSION -SkipLifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore source test scripts after validation
        if: inputs.reuse_build_run_id != '' && env.REUSE_VALIDATION != 'true'
        shell: bash
        run: |
          # Undo only the explicitly overlaid tracked tests. Product changes
          # remain visible to the clean-source guard; packages are never rebuilt.
          git restore --source HEAD --worktree -- \
            scripts/test_windows_lifecycle.ps1 scripts/test_windows_release_extended.ps1 \
            scripts/test_windows_previous_release.ps1 scripts/test_windows_update_reuse.ps1 \
            scripts/test_windows_uv_progress.py
          # Older release commits do not yet contain the shared workspace helpers.
          for helper in scripts/workspace.py scripts/workspace.ps1; do
            if git cat-file -e "HEAD:$helper" 2>/dev/null; then
              git restore --source HEAD --worktree -- "$helper"
            else
              rm -f -- "$helper"
            fi
          done

      - name: Verify and collect release artifacts
        shell: bash
        run: uv run --no-project python scripts/check_release_artifacts.py "$RELEASE_VERSION" "$RELEASE_COMMIT" --collect

      - name: Upload verified distributions and checksums
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ inputs.version }}-${{ inputs.commit }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics and available artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failed-release-${{ inputs.version }}-${{ inputs.commit }}
          path: |
            plugin/build/*.xpi
            plugin/build/update*.json
            server/dist/*
            dist/*.zip
            dist/*.exe
            dist/*.json
            ${{ env.PDF2ZH_WINDOWS_APP_ROOT }}/logs/**
            ${{ env.PDF2ZH_WINDOWS_APP_ROOT }}/last-operation-error.txt
            .local-dev/reports/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Save prepared renderer toolchain after a later failure
        if: failure() && steps.renderer-tools.outcome == 'success' && steps.renderer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tmp/cache/windows-build-archives
          key: windows-release-slint-1.18.1-skia-153-llvm-21.1.8-archives-v2

      - name: Remove the isolated build drive
        if: always() && env.PDF2ZH_WINDOWS_BUILD_ROOT != ''
        shell: pwsh
        run: 'subst.exe P: /D'
