name: Documentation and website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '**/*.md'
      - 'assets/**'
      - 'LICENSE'
      - 'plugin/package.json'
      - 'server/**'
      - 'benchmarks/translation/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '**/*.md'
      - 'assets/**'
      - 'LICENSE'
      - 'plugin/package.json'
      - 'server/**'
      - 'benchmarks/translation/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r website/requirements.txt
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s scripts -p 'test_check_docs.py'
      - run: python -m unittest discover -s website -p 'test_*.py'
      - run: python benchmarks/translation/validate_site.py
      - run: node --test website/test_site.cjs benchmarks/translation/test_ui.cjs
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        with:
          name: plugin-website
          path: dist/site/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/site/

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
