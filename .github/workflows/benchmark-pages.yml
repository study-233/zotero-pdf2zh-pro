name: Translation benchmark pages
on:
  push:
    branches: [main]
    paths: ['benchmarks/translation/**', '.github/workflows/benchmark-pages.yml']
  pull_request:
    paths: ['benchmarks/translation/**', '.github/workflows/benchmark-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: translation-benchmark-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s benchmarks/translation -p 'test_*.py'
      - run: python benchmarks/translation/validate_site.py
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish existing static data only
        run: |
          git subtree split --prefix=benchmarks/translation/site -b benchmark-pages-build
          # The dedicated branch contains generated public files only. Squash
          # merges can rewrite subtree ancestry; lease protects concurrent deploys.
          remote_sha=$(git ls-remote origin refs/heads/codex/translation-benchmark-pages | cut -f1)
          git push --force-with-lease=refs/heads/codex/translation-benchmark-pages:"$remote_sha" origin benchmark-pages-build:codex/translation-benchmark-pages
