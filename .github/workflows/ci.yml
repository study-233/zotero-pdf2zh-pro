name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build and check plugin
        working-directory: plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm lint:check
          pnpm test

      - name: Test server core
        run: uv run --directory server --locked python -m unittest discover -s tests

      - name: Test isolated development manager
        run: python -m unittest discover -s scripts -p 'test_dev.py'

      - name: Test release artifact guards
        run: uv run --no-project python -m unittest discover -s scripts -p 'test_release*.py'

      - name: Test glossary source snapshot guards
        run: uv run --no-project python -m unittest discover -s scripts -p 'test_glossary_data.py'

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 10
    # Native compilation belongs to local development or the release build.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Windows script and transaction checks
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check_windows_scripts.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_windows_shortcuts.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_windows_runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_windows_cleanup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows progress, uninstall and artifact guard tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp | Out-Null
          uv run --no-project python scripts/test_windows_progress.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @('test_windows_uninstall.py', 'test_windows_pe.py', 'test_windows_slint_gate.py', 'test_prepare_windows_skia_source.py')) {
            uv run --no-project python "scripts/$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  codex-native:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Test native Codex discovery and process cleanup without accounts
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --with psutil python -m unittest discover -s tests -p test_codex_discovery.py
          uv run --no-project --with psutil python -m unittest discover -s tests -p test_codex_client.py
