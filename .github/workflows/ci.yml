name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Build and check plugin
        working-directory: plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test

      - name: Test server core
        run: uv run --directory server --locked python -m unittest discover -s tests

      - name: Test Windows control center state
        working-directory: windows-app
        run: |
          pnpm install --frozen-lockfile
          pnpm test
