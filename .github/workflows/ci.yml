name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build and check plugin
        working-directory: plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm lint:check
          pnpm test

      - name: Test server core
        run: uv run --directory server --locked python -m unittest discover -s tests

      - name: Test isolated development manager
        run: python -m unittest discover -s scripts -p 'test_dev.py'

      - name: Test release artifact guards
        run: uv run --no-project python -m unittest discover -s scripts -p 'test_release*.py'

      - name: Test glossary source snapshot guards
        run: uv run --no-project python -m unittest discover -s scripts -p 'test_glossary_data.py'

  windows-native:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/cache@v4
        with:
          path: .tmp/windows-build-tools
          key: windows-slint-1.18.1-skia-153-llvm-21.1.8-v1
      - name: Prepare portable Windows renderer toolchain
        shell: pwsh
        run: ./scripts/prepare_windows_build_tools.ps1
      - name: Use a short Windows build path
        shell: pwsh
        run: |
          if (Test-Path 'P:\') { throw 'The isolated build drive is already occupied' }
          subst.exe P: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'PDF2ZH_WINDOWS_BUILD_ROOT=P:\' >> $env:GITHUB_ENV
      - name: Native control center and transaction tests
        run: |
          ./scripts/build_windows_control.ps1 -RunTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check_windows_scripts.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_windows_runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_windows_cleanup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project python scripts/test_windows_progress.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @('test_windows_uninstall.py', 'test_windows_slint_gate.py', 'test_prepare_windows_skia_source.py')) {
            uv run --no-project python "scripts/$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Remove the isolated build drive
        if: always() && env.PDF2ZH_WINDOWS_BUILD_ROOT != ''
        shell: pwsh
        run: subst.exe P: /D

  codex-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Test native Codex discovery and process cleanup without accounts
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --with psutil python -m unittest discover -s tests -p test_codex_discovery.py
          uv run --no-project --with psutil python -m unittest discover -s tests -p test_codex_client.py
