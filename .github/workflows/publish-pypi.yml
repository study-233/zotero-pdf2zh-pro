name: Publish PyPI
run-name: Publish ${{ inputs.tag }}${{ inputs.dispatch_id && format(' [{0}]', inputs.dispatch_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      build_run_id:
        description: Optional successful Windows build run; publish its verified packages without rebuilding
        required: false
        type: string
      publish_github:
        description: Publish the verified Windows build as the latest GitHub release after PyPI succeeds
        required: false
        type: boolean
        default: false
      dispatch_id:
        description: Unique coordinator correlation ID
        required: false
        type: string
      local_validation:
        description: Receipt for deferred Windows extended checks, bound to exact artifacts
        required: false
        type: string

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    env:
      PDF2ZH_RELEASE_ROOT: ${{ github.workspace }}
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Validate publication inputs
        env:
          PUBLISH_GITHUB: ${{ inputs.publish_github }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          if [[ "$PUBLISH_GITHUB" == true && -z "$BUILD_RUN_ID" ]]; then
            echo 'GitHub publication requires a verified build run.' >&2
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Load shared publication coordinator from workflow revision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-control"
          for name in release_control.py release_policy.py release-policy.json workspace.py; do
            git show "$GITHUB_SHA:scripts/$name" > "$RUNNER_TEMP/release-control/$name"
          done

      - name: Verify tag and versions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          python - "$RELEASE_TAG" <<'PY'
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          version = sys.argv[1].removeprefix("v")
          plugin_metadata = json.loads(Path("plugin/package.json").read_text())
          server_metadata = tomllib.loads(
              Path("server/pyproject.toml").read_text()
          )["project"]
          plugin = plugin_metadata["version"]
          server = server_metadata["version"]
          match = re.search(r'^VERSION = "([^"]+)"$', Path("server/server.py").read_text(), re.MULTILINE)
          runtime = match.group(1) if match else None
          if {plugin, server, runtime} != {version}:
              raise SystemExit(
                  f"version mismatch: tag={version}, plugin={plugin}, server={server}, runtime={runtime}"
              )
          PY

      - name: Download verified packages
        if: inputs.build_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          LOCAL_VALIDATION: ${{ inputs.local_validation }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          COMMIT="$(git rev-parse HEAD)"
          VERSION="${RELEASE_TAG#v}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          python - "$RUNNER_TEMP/build-run.json" "$COMMIT" "$VERSION" <<'PY_VERIFY_RUN'
          import json, re, subprocess, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert run["conclusion"] == "success" and run["status"] == "completed"
          assert run["path"] == ".github/workflows/build-windows-release.yml"
          assert re.fullmatch(re.escape(f"Build v{sys.argv[3]} at {sys.argv[2]}") + r"( \[[0-9a-f]{32}\])?", run["display_title"])
          # A maintenance workflow may validate an older, unchanged release commit.
          # The source identity is also checked against the downloaded manifest below.
          subprocess.run(["git", "merge-base", "--is-ancestor", sys.argv[2], run["head_sha"]], check=True)
          PY_VERIFY_RUN
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-$VERSION-$COMMIT" --dir "$RUNNER_TEMP/verified-release"
          python - "$RUNNER_TEMP/verified-release" "$VERSION" "$COMMIT" <<'PY_VERIFY_FILES'
          import hashlib, json, shutil, sys
          from pathlib import Path
          source, version, commit = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          manifest = json.loads((source / "checksums.json").read_text())
          assert manifest["version"] == version and manifest["commit"] == commit
          import os
          sys.path.insert(0, str(Path(os.environ["RUNNER_TEMP"], "release-control")))
          from release_control import verify_publication_contract
          receipt = os.environ.get("LOCAL_VALIDATION", "").lstrip("\ufeff")
          verify_publication_contract(source, json.loads(receipt) if receipt else None)
          target = Path("server/dist")
          target.mkdir(parents=True, exist_ok=True)
          for name in manifest["artifacts"]:
              assert Path(name).name == name
              payload = (source / name).read_bytes()
              expected = manifest["artifacts"][name]
              assert len(payload) == expected["size"]
              assert hashlib.sha256(payload).hexdigest() == expected["sha256"]
          for name in [f"zotero_pdf2zh_pro-{version}-py3-none-any.whl", f"zotero_pdf2zh_pro-{version}.tar.gz"]:
              assert name in manifest["artifacts"]
              shutil.copyfile(source / name, target / name)
          import zipfile
          sys.path.insert(0, "scripts")
          from windows_pe import validate_release_pe
          from build_windows_installer import verify_installer
          verify_installer(source / "zotero-pdf2zh-pro-windows-x64-setup.exe", version)
          with zipfile.ZipFile(source / "zotero-pdf2zh-pro-windows-x64.zip") as archive:
              validate_release_pe(archive.read("zotero-pdf2zh-pro.exe"))
          PY_VERIFY_FILES

      - name: Build package
        if: inputs.build_run_id == ''
        run: uv build server --out-dir server/dist --clear --no-sources

      - name: Validate package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/check_pypi_artifacts.py server/dist "${RELEASE_TAG#v}"

      - name: Publish package
        run: >-
          uv publish
          --trusted-publishing always
          --check-url https://pypi.org/simple/zotero-pdf2zh-pro/
          server/dist/*

      - name: Verify public PyPI files before distributing installers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - "$RELEASE_TAG" <<'PY_PYPI'
          import hashlib, json, sys, time
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.error import HTTPError, URLError
          version = sys.argv[1].removeprefix("v")
          expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path("server/dist").iterdir() if p.is_file()}
          for attempt in range(30):
              try:
                  with urlopen(f"https://pypi.org/pypi/zotero-pdf2zh-pro/{version}/json", timeout=10) as response:
                      published = {p["filename"]: p["digests"]["sha256"] for p in json.load(response)["urls"]}
                  for name, digest in expected.items():
                      if name in published and published[name] != digest:
                          raise RuntimeError(f"PyPI content mismatch: {name}")
                  if all(published.get(name) == digest for name, digest in expected.items()):
                      print("Public PyPI wheel and sdist hashes match verified packages")
                      break
              except (HTTPError, URLError):
                  pass
              time.sleep(2)
          else:
              raise RuntimeError("Public PyPI files not yet verified; GitHub publication withheld")
          PY_PYPI

      - name: Publish verified GitHub release
        if: inputs.publish_github
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python - "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md" <<'PY_NOTES'
          import sys
          from pathlib import Path
          tag, output = sys.argv[1], Path(sys.argv[2])
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = changelog.split("## " + tag + " - ", 1)[1].split("\n## ", 1)[0]
          notes = "## " + tag + " - " + section.strip() + "\n\n"
          if tag == "v1.6.9":
              notes += "已知 Windows 限制：精简用户配置缺少系统 Run 注册表键时，自启注册可能失败；扩展迁移测试中，回滚后的再次启动健康检查仍有未解决失败。标准安装、启动、升级、卸载单独验证，暂不宣称迁移全面通过。\n\n"
          output.write_text(notes, encoding="utf-8")
          PY_NOTES
          source="$RUNNER_TEMP/verified-release"
          python "$RUNNER_TEMP/release-control/release_control.py" publish "$RELEASE_TAG" "$(git rev-parse HEAD)" "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY" \
            "$source/zotero-pdf2zh-pro.xpi" "$source/update.json" \
            "$source/zotero-pdf2zh-pro-windows-x64.zip" "$source/zotero-pdf2zh-pro-windows-x64-setup.exe" "$source/windows-update.json"
