version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/plugin"
      open-pull-requests-limit: 0
      schedule:
          interval: "weekly"
      groups:
          security:
              applies-to: security-updates
              patterns: ["*"]
    - package-ecosystem: "uv"
      directory: "/server"
      open-pull-requests-limit: 0
      schedule:
          interval: "weekly"
      groups:
          security:
              applies-to: security-updates
              patterns: ["*"]
    - package-ecosystem: "pip"
      directory: "/website"
      open-pull-requests-limit: 0
      schedule:
          interval: "weekly"
      groups:
          security:
              applies-to: security-updates
              patterns: ["*"]
    - package-ecosystem: "cargo"
      directories:
          - "/windows-app"
          - "/windows-app/slint-probe"
      open-pull-requests-limit: 0
      schedule:
          interval: "weekly"
      groups:
          security:
              applies-to: security-updates
              patterns: ["*"]
    - package-ecosystem: "github-actions"
      directory: "/"
      open-pull-requests-limit: 0
      schedule:
          interval: "weekly"
      groups:
          security:
              applies-to: security-updates
              patterns: ["*"]
