<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>翻译 API 配置</title>
        <link rel="stylesheet" href="profileDialogs.css" />
    </head>
    <body>
        <h2 id="title">新增翻译配置</h2>
        <form id="profile-form">
            <div class="field">
                <label for="name">配置名称</label
                ><input id="name" placeholder="留空时使用 API 地址的主机名" />
            </div>
            <div class="field">
                <label for="service">接口类型</label
                ><select id="service" />
            </div>
            <div class="field" id="api-url-field">
                <label for="apiUrl" id="api-url-label">API 地址</label
                ><input
                    id="apiUrl"
                    placeholder="https://example.com/v1"
                    spellcheck="false"
                    autocomplete="off"
                />
                <p class="hint" id="api-url-hint">
                    支持 Base URL 或完整的 /chat/completions、/responses
                    地址；请保留站点提供的路径。
                </p>
            </div>
            <div class="field" id="azure-region-field" hidden="hidden">
                <label for="azureRegion">Azure 资源区域</label>
                <input
                    id="azureRegion"
                    placeholder="例如 eastus、chinaeast2；全局资源可留空"
                />
                <p class="hint">
                    以 Azure 控制台资源信息为准；旧配置默认使用 chinaeast2。
                </p>
            </div>
            <div class="field" id="api-key-field">
                <label for="apiKey">API Key</label>
                <div class="inline">
                    <input
                        id="apiKey"
                        type="password"
                        autocomplete="off"
                        spellcheck="false"
                    /><button id="reveal" type="button" aria-pressed="false">
                        显示
                    </button>
                </div>
            </div>
            <div class="field" id="model-field">
                <label for="model" id="model-label">模型</label>
                <div class="inline">
                    <input
                        id="model"
                        role="combobox"
                        aria-autocomplete="list"
                        aria-controls="models"
                        aria-expanded="false"
                        placeholder="输入或搜索模型名称"
                        autocomplete="off"
                        spellcheck="false"
                    /><button id="get-models" type="button">获取模型</button>
                </div>
                <select
                    id="models"
                    size="5"
                    aria-label="匹配的模型"
                    hidden="hidden"
                />
                <p class="hint" id="models-hint">
                    可以直接输入模型名称，无需先获取列表。
                </p>
            </div>
            <div class="field" id="reasoning-mode-field">
                <label for="reasoningMode">推理模式</label>
                <select id="reasoningMode">
                    <option value="default">保持现有设置</option>
                    <option value="off" id="reasoning-off">关闭推理</option>
                </select>
                <p class="hint" id="reasoning-hint"></p>
            </div>
            <div class="field" id="codex-path-field" hidden="hidden">
                <label for="cliPath">Codex CLI 路径（可选）</label>
                <input
                    id="cliPath"
                    placeholder="留空自动查找 codex"
                    autocomplete="off"
                    spellcheck="false"
                />
                <p class="hint">
                    在本地服务所在电脑安装 Codex CLI，并运行 codex login
                    登录。复用该系统用户的登录，使用 Standard 速度。
                </p>
            </div>
            <div class="field" id="codex-reasoning-field" hidden="hidden">
                <label for="reasoningEffort">推理档位</label>
                <select id="reasoningEffort">
                    <option value="">模型默认</option>
                </select>
                <p class="hint" id="codex-reasoning-hint">
                    获取模型列表后可选择该模型支持的推理档位。
                </p>
            </div>
            <div class="field" id="codex-proxy-field" hidden="hidden">
                <label for="proxyMode">Codex 代理</label>
                <select id="proxyMode">
                    <option value="inherit">跟随服务环境</option>
                    <option value="manual">指定代理</option>
                    <option value="direct">直接连接</option>
                </select>
                <p class="hint" id="codex-proxy-hint"></p>
            </div>
            <div class="field" id="codex-proxy-url-field" hidden="hidden">
                <label for="proxyUrl">代理地址</label>
                <input
                    id="proxyUrl"
                    placeholder="http://127.0.0.1:7897"
                    autocomplete="off"
                    spellcheck="false"
                />
                <p class="hint">
                    填写本地服务所在电脑的 HTTP(S) 或 Mixed 代理地址与端口，不填
                    API 地址或账号密码。
                </p>
            </div>
            <details id="advanced">
                <summary>高级设置</summary>
                <div class="field" id="protocol-field">
                    <label for="apiProtocol">接口协议</label
                    ><select id="apiProtocol">
                        <option value="auto">自动识别（推荐）</option>
                        <option value="chat_completions">
                            Chat Completions
                        </option>
                        <option value="responses">Responses</option>
                    </select>
                </div>
                <div class="field" id="request-options-field">
                    <label for="requestOptions">额外请求参数（JSON）</label
                    ><textarea
                        id="requestOptions"
                        rows="3"
                        placeholder='{"temperature": 0.2}'
                    />
                    <p class="hint">不能覆盖模型、翻译输入或连接设置。</p>
                </div>
                <div class="field">
                    <label for="extraData"
                        >内部配置参数（兼容旧配置，JSON）</label
                    ><textarea id="extraData" rows="3" />
                </div>
            </details>
            <div class="toolbar">
                <button id="test" type="button">测试 API</button
                ><span class="hint"
                    >会发送一条短翻译请求，使用当前填写内容。</span
                >
            </div>
            <p id="status" class="status" role="status" aria-live="polite" />
            <footer>
                <button id="cancel" type="button">取消</button
                ><button id="save-only" type="button">仅保存</button
                ><button id="save" class="primary" type="submit">
                    保存并使用
                </button>
            </footer>
        </form>
        <script charset="utf-8" src="profileEditor.js" />
    </body>
</html>
