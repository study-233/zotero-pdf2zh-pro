    <head>
        <title>zotero-pdf2zh-pro 任务列表</title>
        <meta charset="utf-8" />
        <style>
            :root {
                --surface: #fbfbfa;
                --surface-subtle: #f5f6f7;
                --surface-hover: rgba(38, 49, 72, 0.06);
                --text-primary: #0f1115;
                --text-secondary: #61666b;
                --text-tertiary: #81858c;
                --border: rgba(15, 17, 21, 0.12);
                --border-strong: rgba(15, 17, 21, 0.18);
                --accent: #4176e6;
                --primary: #0f1115;
                --primary-hover: #43454a;
                --primary-text: #ffffff;
                --focus-ring: rgba(65, 118, 230, 0.28);
                --ease: cubic-bezier(0.4, 0, 0.2, 1);
            }

            body {
                margin: 0;
                padding: 14px;
                background: #ececea;
                color: #1f2328;
                font:
                    13px/1.4 -apple-system,
                    BlinkMacSystemFont,
                    "SF Pro Text",
                    "Segoe UI",
                    sans-serif;
            }

            .page {
                display: flex;
                flex-direction: column;
                gap: 10px;
                min-width: 760px;
            }

            .toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                padding: 10px 12px;
                background: #fbfbfa;
                border: 1px solid #d6d6d2;
                border-radius: 8px;
            }

            .title {
                font-size: 15px;
                font-weight: 650;
            }

            .subtitle {
                color: #656b73;
                font-size: 12px;
            }

            .toolbar-actions {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .connection {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                min-height: 28px;
                padding: 0 9px;
                border: 1px solid #d6d6d2;
                border-radius: 8px;
                background: #f7f7f5;
                color: #4f565f;
                white-space: nowrap;
            }

            .connection-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #8b949e;
            }

            .connection.connected .connection-dot,
            .connection.open .connection-dot {
                background: #1a7f37;
            }

            .connection.connecting .connection-dot {
                background: #bf8700;
            }

            .connection.closed .connection-dot,
            .connection.error .connection-dot {
                background: #cf222e;
            }

            .button {
                border: 1px solid #c8c8c3;
                background: #fff;
                color: #1f2328;
                border-radius: 8px;
                padding: 5px 9px;
                cursor: pointer;
                font: inherit;
                min-height: 28px;
            }

            .button:hover:not(:disabled) {
                background: var(--surface-hover);
                border-color: #9fa6ad;
            }

            .button:focus-visible,
            .segment:focus-visible,
            .metrics-details summary:focus-visible,
            .metric-rail:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
                box-shadow: 0 0 0 3px var(--focus-ring);
            }

            .button:disabled {
                cursor: default;
                opacity: 0.55;
            }

            .button.danger {
                border-color: #e2aaa6;
                color: #a40e26;
                background: #fff8f7;
            }

            .button.primary {
                border-color: var(--primary);
                color: var(--primary-text);
                background: var(--primary);
            }

            .button.primary:hover:not(:disabled) {
                border-color: var(--primary-hover);
                background: var(--primary-hover);
            }

            .stats {
                display: grid;
                grid-template-columns: repeat(4, minmax(120px, 1fr));
                gap: 8px;
            }

            .stat {
                min-width: 0;
                border: 1px solid #d6d6d2;
                border-radius: 8px;
                background: #fbfbfa;
                padding: 8px 10px;
            }

            .stat-label {
                color: #656b73;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.03em;
            }

            .stat-value {
                margin-top: 2px;
                font-size: 18px;
                line-height: 1.1;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }

            .control-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 8px 10px;
                background: #fbfbfa;
                border: 1px solid #d6d6d2;
                border-radius: 8px;
            }

            .segmented {
                display: inline-flex;
                padding: 2px;
                gap: 2px;
                background: #e7e7e4;
                border: 1px solid #d1d1cd;
                border-radius: 8px;
            }

            .segment {
                min-height: 26px;
                border: 0;
                border-radius: 6px;
                background: transparent;
                color: #4f565f;
                cursor: pointer;
                font: inherit;
                padding: 4px 10px;
                white-space: nowrap;
            }

            .segment.active {
                background: #fff;
                color: #1f2328;
                box-shadow: 0 1px 2px rgba(27, 31, 36, 0.12);
            }

            .list-meta {
                color: #656b73;
                font-size: 12px;
                white-space: nowrap;
            }

            .list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .card {
                background: #fbfbfa;
                border: 1px solid #d6d6d2;
                border-radius: 8px;
                padding: 10px 12px;
            }

            .card-header {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                align-items: flex-start;
            }

            .task-title {
                min-width: 0;
            }

            .name {
                font-weight: 650;
                word-break: break-word;
            }

            .meta {
                color: #656b73;
                font-size: 12px;
                margin-top: 1px;
            }

            .status {
                padding: 3px 7px;
                border-radius: 8px;
                font-size: 12px;
                background: #ececeb;
                white-space: nowrap;
            }

            .status.running {
                background: #e7f1ff;
                color: #1c5fb8;
            }

            .status.cancelling {
                background: #fff0cf;
                color: #8a5b00;
            }

            .status.completed {
                background: #e8f7eb;
                color: #216e39;
            }

            .status.failed,
            .status.cancelled {
                background: #fdecec;
                color: #af2b2b;
            }

            .grid {
                margin-top: 9px;
                display: grid;
                grid-template-columns: 1.1fr 1fr 0.8fr 1fr 0.7fr;
                gap: 8px;
            }

            .metric-label {
                color: #656b73;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.03em;
            }

            .metric-value {
                margin-top: 1px;
                font-weight: 600;
                word-break: break-word;
                font-variant-numeric: tabular-nums;
            }

            .progress {
                margin-top: 9px;
            }

            .progress-track {
                height: 7px;
                border-radius: 8px;
                background: #ececeb;
                overflow: hidden;
            }

            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #2563eb, #16836b);
                border-radius: 8px;
                transition: width 160ms var(--ease);
            }

            .observability-summary,
            .observability-detail-grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 8px;
            }

            .observability-summary {
                margin-top: 9px;
                padding: 8px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface-subtle);
            }

            .observability-item {
                min-width: 0;
            }

            .metrics-details {
                margin-top: 6px;
                border-top: 1px solid var(--border);
            }

            .metrics-details summary {
                width: max-content;
                margin-top: 6px;
                color: var(--text-secondary);
                cursor: pointer;
                border-radius: 6px;
                padding: 3px 6px;
                list-style-position: inside;
                user-select: none;
            }

            .metrics-details summary:hover {
                background: var(--surface-hover);
                color: var(--text-primary);
            }

            .observability-detail-grid {
                margin-top: 4px;
                padding: 8px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface);
            }

            .metric-note {
                margin-top: 6px;
                color: var(--text-tertiary);
                font-size: 11px;
            }

            .progress-meta {
                margin-top: 5px;
                display: flex;
                justify-content: space-between;
                gap: 12px;
                font-size: 12px;
                color: #555;
            }

            .error {
                margin-top: 8px;
                color: #a40e26;
                font-size: 12px;
                white-space: pre-wrap;
                word-break: break-word;
                border-left: 3px solid #e2aaa6;
                padding-left: 8px;
            }

            .actions {
                margin-top: 9px;
                display: flex;
                justify-content: flex-end;
                gap: 6px;
                flex-wrap: wrap;
            }

            .empty {
                border: 1px dashed #ccccca;
                border-radius: 8px;
                padding: 22px;
                text-align: center;
                color: #656b73;
                background: rgba(255, 255, 255, 0.5);
            }

            @media (max-width: 900px) {
                body {
                    padding: 10px;
                }

                .page {
                    min-width: 0;
                }

                .toolbar,
                .control-bar {
                    align-items: stretch;
                    flex-direction: column;
                }

                .toolbar-actions {
                    justify-content: flex-start;
                }

                .stats {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                .grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                .observability-summary,
                .observability-detail-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                .progress-meta {
                    flex-direction: column;
                    gap: 2px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    scroll-behavior: auto !important;
                    transition-duration: 0.01ms !important;
                    animation-duration: 0.01ms !important;
                }
            }
        </style>
        <style>

                border-radius: 3px;
                transition: width 200ms var(--ease);
            }

            .observability-item {
                min-width: 0;
                padding: 8px 10px;
            }

            .observability-item + .observability-item {
                border-left: 1px solid var(--border);
            }

            .metrics-panel {
                margin: 0 16px 12px;
            }

            .metrics-panel[hidden] {
                display: none;
            }

            .observability-detail-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                margin-top: 6px;
                padding: 0;
                gap: 0;
                overflow: hidden;
                border-color: var(--border);
                background: var(--surface-subtle);
            }

            .observability-detail-grid .observability-item:nth-child(3n + 1) {
                border-left: 0;
            }

            .observability-detail-grid .observability-item:nth-child(n + 4) {
                border-top: 1px solid var(--border);
            }

            .metric-note {
                margin-top: 0;
                padding: 6px 8px 2px;
                line-height: 16px;
            }

            .task-footer {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 44px;
                padding: 8px 12px;
                border-top: 1px solid var(--border);
                background: var(--surface-subtle);
            }

            .metric-rail {
                display: flex;
                flex: 1 1 auto;
                align-items: center;
                min-width: 0;
                overflow-x: auto;
                color: var(--text-secondary);
                white-space: nowrap;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            .metric-rail::-webkit-scrollbar {
                display: none;
                width: 0;
                height: 0;
            }

            .metric-summary-item {
                display: inline-flex;
                flex: 0 0 auto;
                align-items: baseline;
                gap: 4px;
                min-height: 22px;
                padding: 0 10px;
                font-size: 11px;
                line-height: 16px;
                font-variant-numeric: tabular-nums;
            }

            .metric-summary-item:first-child {
                padding-left: 2px;
            }

            .metric-summary-item + .metric-summary-item {
                border-left: 1px solid var(--border);
            }

            .metric-summary-label {
                color: var(--text-tertiary);
            }

            .metric-summary-value {
                color: var(--text-primary);
                font-weight: 500;
            }

            .metric-empty {
                padding: 0 2px;
                color: var(--text-tertiary);
                font-size: 11px;
                line-height: 18px;
            }

            .footer-actions {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                gap: 6px;
            }

            .task-footer .button {
                flex: 0 0 auto;
                min-height: 28px;
                padding: 0 10px;
                font-size: 12px;
                line-height: 18px;
            }

            .task-footer .metrics-toggle {
                border-color: var(--accent-tint);
                background: var(--accent-tint);
                color: var(--accent);
            }

            .task-footer .metrics-toggle:hover:not(:disabled) {
                border-color: var(--accent);
                background: var(--accent-tint);
            }

            .progress-meta {
                margin-top: 6px;
                color: var(--text-tertiary);
                font-size: 11px;
                line-height: 16px;
            }

            .error {
                margin: 0 16px 12px;
                padding: 10px 12px;
                border: 1px solid var(--error-tint);
                border-radius: 8px;
                background: var(--error-tint);
                color: var(--error);
                line-height: 18px;
            }

            .empty {
                padding: 48px 24px;
                border-color: var(--border-strong);
                border-radius: 12px;
                background: var(--surface);
                color: var(--text-secondary);
                box-shadow: var(--shadow-1);
            }

            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                border-radius: 4px;
                background: var(--border-strong);
            }

            @media (max-width: 900px) {
                body {
                    padding: 12px;
                }

                .observability-detail-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                .stat:nth-child(3) {
                    border-left: 0;
                }

                .stat:nth-child(n + 3) {
                    border-top: 1px solid var(--border);
                }

                .task-metric:nth-child(odd) {
                    border-left: 0;
                }

                .task-metric:nth-child(n + 3) {
                    border-top: 1px solid var(--border);
                }

                .observability-item:nth-child(odd) {
                    border-left: 0;
                }

                .observability-item:nth-child(n + 3) {
                    border-top: 1px solid var(--border);
                }

                .observability-detail-grid .observability-item:nth-child(even) {
                    border-left: 1px solid var(--border);
                }
            }

            @media (max-width: 620px) {
                .toolbar {
                    padding: 16px;
                }

                .toolbar-actions,
                .segmented {
                    width: 100%;
                }

                .button,
                .segment {
                    flex: 1;
                }

                .connection {
                    width: 100%;
                    justify-content: center;
                }

                .control-bar {
                    position: static;
                }

                .card-header {
                    align-items: flex-start;
                }

                .name,
                .meta {
                    white-space: normal;
                }

                .task-footer {
                    align-items: stretch;
                    flex-direction: column;
                    gap: 8px;
                }

                .metric-rail {
                    width: 100%;
                }

                .footer-actions {
                    justify-content: flex-end;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="toolbar">
                <div class="heading">
                    <div class="eyebrow">zotero PDF2ZH Pro</div>
                    <div class="title">翻译任务</div>
                    <div class="subtitle">
                        跟踪翻译进度、服务状态与附件导入结果
                    </div>
                </div>
                <div class="toolbar-actions">
                    <div id="connection-status" class="connection unknown">
                        <span class="connection-dot"></span>
                        <span id="connection-label">事件流未知</span>
                    </div>
                    <button id="refresh-btn" class="button">刷新</button>
                    <button id="retry-all-failed-btn" class="button primary">
                        重试全部失败
                    </button>
                    <button id="clear-failed-btn" class="button danger">
                        清理失败任务
                    </button>
                    <button id="close-btn" class="button">关闭</button>
                </div>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">全部任务</div>
                    <div class="stat-value">
                        <span id="stat-total">0</span>
                        <span class="stat-hint">条记录</span>
                    </div>
                </div>
                <div class="stat" data-tone="active">
                    <div class="stat-label">正在处理</div>
                    <div class="stat-value">
                        <span id="stat-running">0</span>
                        <span class="stat-hint">运行中</span>
                    </div>
                </div>
                <div class="stat" data-tone="failed">
                    <div class="stat-label">需要处理</div>
                    <div class="stat-value">
                        <span id="stat-failed">0</span>
                        <span class="stat-hint">失败任务</span>
                    </div>
                </div>
                <div class="stat" data-tone="completed">
                    <div class="stat-label">已完成</div>
                    <div class="stat-value">
                        <span id="stat-completed">0</span>
                        <span class="stat-hint">含已导入</span>
                    </div>
                </div>
            </div>
            <div class="control-bar">
                <div id="filter-control" class="segmented" role="tablist">
                    <button class="segment active" data-filter="all" role="tab">
                        全部
                        <span id="filter-count-all" class="segment-count"
                            >0</span
                        >
                    </button>
                    <button class="segment" data-filter="active" role="tab">
                        进行中
                        <span id="filter-count-active" class="segment-count"
                            >0</span
                        >
                    </button>
                    <button class="segment" data-filter="failed" role="tab">
                        失败
                        <span id="filter-count-failed" class="segment-count"
                            >0</span
                        >
                    </button>
                    <button class="segment" data-filter="completed" role="tab">
                        已完成
                        <span id="filter-count-completed" class="segment-count"
                            >0</span
                        >
                    </button>
                </div>
                <div id="list-meta" class="list-meta">0 个任务</div>
            </div>
            <div id="task-list" class="list"></div>
        </div>

        <script>
            // <![CDATA[
            let api;
            let unsubscribeTasksChanged = null;
            let currentTasks = [];
            let currentFilter = "all";
            const expandedMetricTaskIds = new Set();
            const taskCardViews = new Map();
            let emptyStateNode = null;
            let pendingRenderTasks = null;
            let renderFrameId = null;

            document.addEventListener("DOMContentLoaded", async () => {
                api = window.arguments && window.arguments[0];
                if (api && api._initPromise) {
                    api._initPromise.resolve();
                }
                if (api && api.onTasksChanged) {
                    unsubscribeTasksChanged = api.onTasksChanged(() => {
                        scheduleRender(api.getTasks());
                    });
                }

                document
                    .getElementById("filter-control")
                    .addEventListener("click", (event) => {
                        const button = event.target.closest(
                            "button[data-filter]",
                        );
                        if (!button) return;
                        currentFilter = button.getAttribute("data-filter");
                        render(currentTasks);
                    });

                document
                    .getElementById("retry-all-failed-btn")
                    .addEventListener("click", async () => {
                        await retryAllFailed();
                    });
                document
                    .getElementById("clear-failed-btn")
                    .addEventListener("click", async () => {
                        try {
                            await api.clearFailedTasks();
                            render(api.getTasks());
                            void refresh();
                        } catch (error) {
                            alert(String(error));
                        }
                    });
                document
                    .getElementById("refresh-btn")
                    .addEventListener("click", () => void refresh());
                document
                    .getElementById("close-btn")
                    .addEventListener("click", () => window.close());

                await refresh();
            });

            window.addEventListener("unload", () => {
                if (renderFrameId !== null) {
                    window.cancelAnimationFrame(renderFrameId);
                    renderFrameId = null;
                }
                if (unsubscribeTasksChanged) {
                    unsubscribeTasksChanged();
                    unsubscribeTasksChanged = null;
                }
            });

            async function refresh() {
                if (!api) return;
                await api.refreshTasks();
                scheduleRender(api.getTasks());
            }

            function scheduleRender(tasks) {
                pendingRenderTasks = tasks || [];
                if (renderFrameId !== null) return;
                renderFrameId = window.requestAnimationFrame(() => {
                    renderFrameId = null;
                    const latestTasks = pendingRenderTasks || [];
                    pendingRenderTasks = null;
                    render(latestTasks);
                });
            }

            function render(tasks) {
                const root = document.getElementById("task-list");
                currentTasks = tasks || [];
                updateConnectionStatus();
                renderStats(currentTasks);
                renderFilterButtons();

                const currentTaskIds = new Set(
                    currentTasks.map((task) => task.taskId),
                );
                taskCardViews.forEach((view, taskId) => {
                    if (currentTaskIds.has(taskId)) return;
                    view.card.remove();
                    taskCardViews.delete(taskId);
                    expandedMetricTaskIds.delete(taskId);
                });

                const filteredTasks = currentTasks.filter(matchesCurrentFilter);
                setTextContent(
                    document.getElementById("list-meta"),
                    `${filteredTasks.length}/${currentTasks.length} 个任务`,
                );

                if (filteredTasks.length === 0) {
                    if (!emptyStateNode) {
                        emptyStateNode = document.createElement("div");
                        emptyStateNode.className = "empty";
                    }
                    setTextContent(
                        emptyStateNode,
                        currentTasks.length === 0
                            ? "当前没有任务。"
                            : "当前筛选条件下没有任务。",
                    );
                    Array.from(root.children).forEach((child) => {
                        if (child !== emptyStateNode) child.remove();
                    });
                    if (emptyStateNode.parentNode !== root) {
                        root.appendChild(emptyStateNode);
                    }
                    return;
                }

                const visibleTaskIds = new Set(
                    filteredTasks.map((task) => task.taskId),
                );
                Array.from(root.children).forEach((child) => {
                    if (!visibleTaskIds.has(child.dataset.taskId)) {
                        child.remove();
                    }
                });

                filteredTasks.forEach((task, index) => {
                    let view = taskCardViews.get(task.taskId);
                    if (!view) {
                        view = createTaskCardView(task);
                        taskCardViews.set(task.taskId, view);
                    }

                    const signature =
                        view.task === task
                            ? view.signature
                            : getTaskRenderSignature(task);
                    if (view.signature !== signature) {
                        updateTaskCardView(view, task);
                        view.signature = signature;
                    } else {
                        view.task = task;
                    }

                    const currentNode = root.children[index] || null;
                    if (currentNode !== view.card) {
                        root.insertBefore(view.card, currentNode);
                    }
                });

                while (root.children.length > filteredTasks.length) {
                    root.lastElementChild.remove();
                }
            }

            function createTaskCardView(task) {
                const view = {
                    task: null,
                    signature: null,
                    pendingAction: null,
                };
                const card = document.createElement("div");
                card.dataset.taskId = task.taskId;

                const header = document.createElement("div");
                header.className = "card-header";
                const titleWrap = document.createElement("div");
                titleWrap.className = "task-title";
                const name = document.createElement("div");
                name.className = "name";
                const meta = document.createElement("div");
                meta.className = "meta";
                const status = document.createElement("div");
                titleWrap.appendChild(name);
                titleWrap.appendChild(meta);
                header.appendChild(titleWrap);
                header.appendChild(status);
                card.appendChild(header);

                const grid = document.createElement("div");
                grid.className = "grid";
                const gridValues = [
                    "阶段",
                    "阶段进度",
                    "总进度",
                    "导入状态",
                    "尝试",
                ].map((label) => {
                    const box = document.createElement("div");
                    box.className = "task-metric";
                    const labelEl = document.createElement("div");
                    labelEl.className = "metric-label";
                    labelEl.textContent = label;
                    const valueEl = document.createElement("div");
                    valueEl.className = "metric-value";
                    box.appendChild(labelEl);
                    box.appendChild(valueEl);
                    grid.appendChild(box);
                    return valueEl;
                });
                card.appendChild(grid);

                const progress = document.createElement("div");
                progress.className = "progress";
                const progressTrack = document.createElement("div");
                progressTrack.className = "progress-track";
                progressTrack.setAttribute("role", "progressbar");
                progressTrack.setAttribute("aria-label", "任务总进度");
                progressTrack.setAttribute("aria-valuemin", "0");
                progressTrack.setAttribute("aria-valuemax", "100");
                const progressFill = document.createElement("div");
                progressFill.className = "progress-fill";
                progressTrack.appendChild(progressFill);
                progress.appendChild(progressTrack);
                const metaRow = document.createElement("div");
                metaRow.className = "progress-meta";
                const createdAt = document.createElement("span");
                const updatedAt = document.createElement("span");
                metaRow.appendChild(createdAt);
                metaRow.appendChild(updatedAt);
                progress.appendChild(metaRow);
                card.appendChild(progress);

                const error = document.createElement("div");
                error.className = "error";
                error.hidden = true;
                card.appendChild(error);

                const metricsPanel = document.createElement("div");
                metricsPanel.className = "metrics-panel";
                metricsPanel.id = `metrics-panel-${sanitizeId(task.taskId)}`;
                metricsPanel.hidden = true;
                const detailGrid = document.createElement("div");
                detailGrid.className = "observability-detail-grid";
                const detailValues = [
                    "实际 QPS（10秒）",
                    "活跃请求",
                    "平均耗时",
                    "P95 耗时",
                    "自动重试",
                    "本地缓存命中率",
                    "DeepSeek 缓存命中率",
                    "Token（输入 / 输出）",
                    "跳过参考文献段落",
                ].map((label) => appendMetric(detailGrid, label, "-"));
                metricsPanel.appendChild(detailGrid);
                const metricNote = document.createElement("div");
                metricNote.className = "metric-note";
                metricsPanel.appendChild(metricNote);
                card.appendChild(metricsPanel);

                const footer = document.createElement("div");
                footer.className = "task-footer";
                const metricRail = document.createElement("div");
                metricRail.className = "metric-rail";
                metricRail.tabIndex = 0;
                metricRail.setAttribute("role", "region");
                metricRail.setAttribute("aria-label", "请求指标摘要");
                const metricEmpty = document.createElement("span");
                metricEmpty.className = "metric-empty";
                metricRail.appendChild(metricEmpty);
                const summaryMetrics = [
                    "费用",
                    "剩余 / 吞吐",
                    "Token",
                    "DeepSeek 缓存",
                    "请求 / 重试",
                    "平均 / P95",
                ].map((label) => appendSummaryMetric(metricRail, label, "-"));
                footer.appendChild(metricRail);

                const footerActions = document.createElement("div");
                footerActions.className = "footer-actions";
                const metricsToggle = document.createElement("button");
                metricsToggle.className = "button metrics-toggle";
                metricsToggle.setAttribute("aria-controls", metricsPanel.id);
                metricsToggle.addEventListener("click", () => {
                    const currentTask = view.task;
                    if (!currentTask?.metrics) return;
                    const isExpanded = metricsPanel.hidden;
                    metricsPanel.hidden = !isExpanded;
                    if (isExpanded) {
                        expandedMetricTaskIds.add(currentTask.taskId);
                    } else {
                        expandedMetricTaskIds.delete(currentTask.taskId);
                    }
                    updateMetricsToggle(metricsToggle, isExpanded);
                });
                footerActions.appendChild(metricsToggle);

                const cancelButton = document.createElement("button");
                cancelButton.className = "button danger";
                cancelButton.textContent = "终止任务";
                cancelButton.addEventListener("click", async () => {
                    const currentTask = view.task;
                    if (!canCancelTask(currentTask)) return;
                    view.pendingAction = "cancel";
                    cancelButton.disabled = true;
                    try {
                        await api.cancelTask(currentTask.taskId);
                        view.pendingAction = null;
                        await refresh();
                    } catch (errorValue) {
                        view.pendingAction = null;
                        alert(String(errorValue));
                        cancelButton.disabled = false;
                    }
                });
                footerActions.appendChild(cancelButton);

                const retryButton = document.createElement("button");
                retryButton.className = "button";
                retryButton.addEventListener("click", async () => {
                    const currentTask = view.task;
                    if (!currentTask) return;
                    view.pendingAction = "retry";
                    retryButton.disabled = true;
                    try {
                        await api.retryTask(currentTask.taskId);
                        view.pendingAction = null;
                        render(api.getTasks());
                    } catch (errorValue) {
                        view.pendingAction = null;
                        alert(String(errorValue));
                        retryButton.disabled = false;
                    }
                });
                footerActions.appendChild(retryButton);

                const deleteButton = document.createElement("button");
                deleteButton.className = "button";
                deleteButton.textContent = "删除记录";
                deleteButton.addEventListener("click", async () => {
                    const currentTask = view.task;
                    if (!currentTask) return;
                    view.pendingAction = "delete";
                    deleteButton.disabled = true;
                    try {
                        await api.deleteTask(currentTask.taskId);
                        view.pendingAction = null;
                        render(api.getTasks());
                        void refresh();
                    } catch (errorValue) {
                        view.pendingAction = null;
                        alert(String(errorValue));
                        deleteButton.disabled = false;
                    }
                });
                footerActions.appendChild(deleteButton);
                footer.appendChild(footerActions);
                card.appendChild(footer);

                Object.assign(view, {
                    card,
                    name,
                    meta,
                    status,
                    gridValues,
                    progressTrack,
                    progressFill,
                    createdAt,
                    updatedAt,
                    error,
                    metricsPanel,
                    detailValues,
                    metricNote,
                    metricEmpty,
                    summaryMetrics,
                    metricsToggle,
                    cancelButton,
                    retryButton,
                    deleteButton,
                });
                updateTaskCardView(view, task);
                view.signature = getTaskRenderSignature(task);
                return view;
            }

            function updateTaskCardView(view, task) {
                view.task = task;
                setClassName(view.card, `card ${task.status}`);
                setTextContent(view.name, task.fileName);
                setTextContent(
                    view.meta,
                    `${task.service} | ${task.outputModes.join(", ")} | ${task.source === "local" ? "本地提交" : "远端任务"}`,
                );
                setClassName(view.status, `status ${task.status}`);
                setTextContent(view.status, formatStatus(task));

                const overallProgress = Math.max(
                    0,
                    Math.min(task.overallProgress || 0, 100),
                );
                const stageProgress = Math.max(
                    0,
                    Math.min(task.stageProgress || 0, 100),
                );
                const fontAssetStage = isFontAssetStage(task.stage);
                const displayedProgress = fontAssetStage
                    ? stageProgress
                    : overallProgress;
                const gridValues = [
                    formatStage(task.stage),
                    formatStageProgress(task),
                    fontAssetStage
                        ? "字体准备完成后开始翻译"
                        : `${Math.round(overallProgress)}%`,
                    formatImportState(task),
                    formatAttempt(task),
                ];
                view.gridValues.forEach((node, index) => {
                    setTextContent(node, gridValues[index]);
                });
                setAttributeValue(
                    view.progressTrack,
                    "aria-valuenow",
                    String(Math.round(displayedProgress)),
                );
                setAttributeValue(
                    view.progressTrack,
                    "aria-label",
                    fontAssetStage ? "字体初始化进度" : "任务总进度",
                );
                const progressWidth = `${displayedProgress}%`;
                if (view.progressFill.style.width !== progressWidth) {
                    view.progressFill.style.width = progressWidth;
                }
                setTextContent(
                    view.createdAt,
                    `创建于 ${formatDate(task.createdAt)}`,
                );
                setTextContent(
                    view.updatedAt,
                    `更新于 ${formatDate(task.updatedAt)}`,
                );

                const errorText = [
                    task.importError || task.error,
                    formatDiagnostics(task.errorDiagnostics),
                ]
                    .filter(Boolean)
                    .join("\n\n");
                setTextContent(view.error, errorText);
                setNodeHidden(view.error, !errorText);

                const metrics = task.metrics;
                if (metrics) {
                    const detailValues = [
                        formatDecimal(metrics.requests?.qps10s, 2),
                        formatInteger(metrics.requests?.active || 0),
                        formatMilliseconds(metrics.requests?.averageLatencyMs),
                        formatMilliseconds(metrics.requests?.p95LatencyMs),
                        formatInteger(metrics.requests?.retries || 0),
                        formatPercent(metrics.localCache?.hitRate),
                        formatPercent(metrics.providerCache?.hitRate),
                        `${formatInteger(metrics.tokens?.input || 0)} / ${formatInteger(metrics.tokens?.output || 0)}`,
                        formatInteger(metrics.referencesSkipped || 0),
                    ];
                    view.detailValues.forEach((node, index) => {
                        setTextContent(node, detailValues[index]);
                    });
                    setTextContent(view.metricNote, formatCostNote(metrics));

                    const summaryValues = [
                        formatCost(metrics),
                        `${formatEta(metrics)} / ${formatThroughput(metrics)}`,
                        `${formatCompactNumber(metrics.tokens?.input || 0)} / ${formatCompactNumber(metrics.tokens?.output || 0)}`,
                        formatPercent(metrics.providerCache?.hitRate),
                        `${formatCompactNumber(metrics.requests?.attempts || 0)} / ${formatCompactNumber(metrics.requests?.retries || 0)}`,
                        `${formatCompactDuration(metrics.requests?.averageLatencyMs)} / ${formatCompactDuration(metrics.requests?.p95LatencyMs)}`,
                    ];
                    view.summaryMetrics.forEach((summary, index) => {
                        setTextContent(summary.value, summaryValues[index]);
                        setNodeHidden(summary.item, false);
                    });
                    setNodeHidden(view.metricEmpty, true);
                    setNodeHidden(view.metricsToggle, false);
                    const isExpanded = expandedMetricTaskIds.has(task.taskId);
                    setNodeHidden(view.metricsPanel, !isExpanded);
                    updateMetricsToggle(view.metricsToggle, isExpanded);
                } else {
                    view.summaryMetrics.forEach((summary) => {
                        setNodeHidden(summary.item, true);
                    });
                    setTextContent(
                        view.metricEmpty,
                        isActiveTask(task) ? "指标采集中" : "暂无请求指标",
                    );
                    setNodeHidden(view.metricEmpty, false);
                    setNodeHidden(view.metricsPanel, true);
                    setNodeHidden(view.metricsToggle, true);
                }

                setNodeHidden(view.cancelButton, !canCancelTask(task));
                view.cancelButton.disabled = view.pendingAction === "cancel";
                setTextContent(
                    view.retryButton,
                    task.status === "completed" ? "重试导入" : "重试任务",
                );
                setNodeHidden(view.retryButton, !canRetry(task));
                view.retryButton.disabled = view.pendingAction === "retry";
                setNodeHidden(view.deleteButton, !canDelete(task));
                view.deleteButton.disabled = view.pendingAction === "delete";
            }

            function getTaskRenderSignature(task) {
                return JSON.stringify([
                    task.fileName,
                    task.service,
                    task.outputModes,
                    task.status,
                    task.stage,
                    task.stageCurrent,
                    task.stageTotal,
                    task.stageProgress,
                    task.overallProgress,
                    task.error,
                    task.errorDiagnostics,
                    task.attempt,
                    task.createdAt,
                    task.updatedAt,
                    task.canCancel,
                    task.source,
                    task.importState,
                    task.importError,
                    task.metrics,
                ]);
            }

            function setTextContent(node, value) {
                const nextValue = String(value ?? "");
                if (node.textContent !== nextValue) {
                    node.textContent = nextValue;
                }
            }

            function setClassName(node, value) {
                if (node.className !== value) {
                    node.className = value;
                }
            }

            function setAttributeValue(node, name, value) {
                if (node.getAttribute(name) !== value) {
                    node.setAttribute(name, value);
                }
            }

            function setNodeHidden(node, hidden) {
                if (node.hidden !== hidden) {
                    node.hidden = hidden;
                }
            }

            function renderStats(tasks) {
                const stats = {
                    total: tasks.length,
                    running: tasks.filter(isRunningTask).length,
                    failed: tasks.filter(isFailedTask).length,
                    completed: tasks.filter(isCompletedTask).length,
                };
                setTextContent(
                    document.getElementById("stat-total"),
                    stats.total,
                );
                setTextContent(
                    document.getElementById("stat-running"),
                    stats.running,
                );
                setTextContent(
                    document.getElementById("stat-failed"),
                    stats.failed,
                );
                setTextContent(
                    document.getElementById("stat-completed"),
                    stats.completed,
                );
                setTextContent(
                    document.getElementById("filter-count-all"),
                    stats.total,
                );
                setTextContent(
                    document.getElementById("filter-count-active"),
                    tasks.filter(isActiveTask).length,
                );
                setTextContent(
                    document.getElementById("filter-count-failed"),
                    stats.failed,
                );
                setTextContent(
                    document.getElementById("filter-count-completed"),
                    stats.completed,
                );
                document.getElementById("retry-all-failed-btn").disabled =
                    stats.failed === 0 || !api;
            }

            function renderFilterButtons() {
                document
                    .querySelectorAll("#filter-control .segment")
                    .forEach((button) => {
                        const active =
                            button.getAttribute("data-filter") ===
                            currentFilter;
                        if (button.classList.contains("active") !== active) {
                            button.classList.toggle("active", active);
                        }
                        setAttributeValue(
                            button,
                            "aria-selected",
                            active ? "true" : "false",
                        );
                    });
            }

            function updateConnectionStatus() {
                const status = document.getElementById("connection-status");
                const label = document.getElementById("connection-label");
                const rawState =
                    api && typeof api.getEventStreamState === "function"
                        ? api.getEventStreamState()
                        : null;
                const state = normalizeEventStreamState(rawState);
                setClassName(status, `connection ${state.className}`);
                setTextContent(label, state.label);
            }

            async function retryAllFailed() {
                if (!api) return;
                const retryButton = document.getElementById(
                    "retry-all-failed-btn",
                );
                retryButton.disabled = true;
                try {
                    if (typeof api.retryFailedTasks === "function") {
                        await api.retryFailedTasks();
                    } else {
                        const failedTasks = currentTasks.filter(canRetry);
                        for (const task of failedTasks) {
                            await api.retryTask(task.taskId);
                        }
                    }
                    render(api.getTasks());
                    void refresh();
                } catch (error) {
                    alert(String(error));
                    render(currentTasks);
                }
            }

            function matchesCurrentFilter(task) {
                if (currentFilter === "active") return isActiveTask(task);
                if (currentFilter === "failed") return isFailedTask(task);
                if (currentFilter === "completed") return isCompletedTask(task);
                return true;
            }

            function isActiveTask(task) {
                return (
                    task.status === "queued" ||
                    task.status === "running" ||
                    task.status === "cancelling" ||
                    task.importState === "pending" ||
                    task.importState === "importing"
                );
            }

            function isRunningTask(task) {
                return task.status === "running";
            }

            function isFailedTask(task) {
                return (
                    task.status === "failed" || task.importState === "failed"
                );
            }

            function isCompletedTask(task) {
                return (
                    task.status === "completed" ||
                    task.importState === "imported"
                );
            }

            function normalizeEventStreamState(rawState) {
                if (rawState === null || rawState === undefined) {
                    return {
                        className: "unknown",
                        label: "事件流不可用",
                    };
                }
                if (typeof rawState === "object") {
                    const total = Number(rawState.total || 0);
                    const connected = Number(rawState.connected || 0);
                    if (total === 0) {
                        return {
                            className: "closed",
                            label: "事件流未连接",
                        };
                    }
                    if (rawState.hasErrors) {
                        return {
                            className: "error",
                            label: `事件流异常 ${connected}/${total}`,
                        };
                    }
                    if (connected === total) {
                        return {
                            className: "connected",
                            label: `事件流已连接 ${connected}/${total}`,
                        };
                    }
                    return {
                        className: "connecting",
                        label: `事件流连接中 ${connected}/${total}`,
                    };
                }
                const state = String(rawState).toLowerCase();
                const mapping = {
                    open: ["open", "事件流已连接"],
                    connected: ["connected", "事件流已连接"],
                    connecting: ["connecting", "事件流连接中"],
                    closed: ["closed", "事件流已断开"],
                    disconnected: ["closed", "事件流已断开"],
                    error: ["error", "事件流异常"],
                };
                const item = mapping[state];
                if (item) {
                    return {
                        className: item[0],
                        label: item[1],
                    };
                }
                return {
                    className: "unknown",
                    label: `事件流 ${rawState}`,
                };
            }

            function formatStatus(task) {
                const mapping = {
                    queued: "排队中",
                    running: "运行中",
                    cancelling: "正在终止",
                    completed: "已完成",
                    failed: "失败",
                    cancelled: "已终止",
                };
                if (task.status === "running" && isFontAssetStage(task.stage)) {
                    return "正在准备首次运行所需字体";
                }
                return mapping[task.status] || task.status;
            }

            function isFontAssetStage(stage) {
                return stage === "Check Fonts" || stage === "Download Fonts";
            }

            function formatStage(stage) {
                if (stage === "Check Fonts") {
                    return "检查字体缓存";
                }
                if (stage === "Download Fonts") {
                    return "下载字体资源（首次初始化，仅需一次）";
                }
                return stage || "等待中";
            }

            function formatStageProgress(task) {
                const progress = Math.round(task.stageProgress || 0);
                const current = task.stageCurrent || 0;
                const total = task.stageTotal || 0;
                if (task.stage === "Check Fonts") {
                    return `${progress}% (${current}/${total} 个)`;
                }
                if (task.stage === "Download Fonts") {
                    return `${progress}% (${formatBytes(current)} / ${formatBytes(total)})`;
                }
                return `${progress}% (${current}/${total})`;
            }

            function formatBytes(bytes) {
                const value = Math.max(0, Number(bytes) || 0);
                return `${(value / (1024 * 1024)).toFixed(1)} MB`;
            }

            function formatImportState(task) {
                const mapping = {
                    none: "无",
                    pending: "等待导入",
                    importing: "导入中",
                    imported: "已导入",
                    failed: "导入失败",
                };
                return mapping[task.importState] || task.importState || "无";
            }

            function formatAttempt(task) {
                if (task.attempt === undefined || task.attempt === null) {
                    return "-";
                }
                return String(task.attempt);
            }

            function appendMetric(root, label, value) {
                const item = document.createElement("div");
                item.className = "observability-item";
                const labelEl = document.createElement("div");
                labelEl.className = "metric-label";
                labelEl.textContent = label;
                const valueEl = document.createElement("div");
                valueEl.className = "metric-value";
                valueEl.textContent = value;
                item.appendChild(labelEl);
                item.appendChild(valueEl);
                root.appendChild(item);
                return valueEl;
            }

            function appendSummaryMetric(root, label, value) {
                const item = document.createElement("span");
                item.className = "metric-summary-item";
                const labelEl = document.createElement("span");
                labelEl.className = "metric-summary-label";
                labelEl.textContent = label;
                const valueEl = document.createElement("span");
                valueEl.className = "metric-summary-value";
                valueEl.textContent = value;
                item.appendChild(labelEl);
                item.appendChild(valueEl);
                root.appendChild(item);
                return {
                    item,
                    value: valueEl,
                };
            }

            function updateMetricsToggle(button, isExpanded) {
                setAttributeValue(
                    button,
                    "aria-expanded",
                    isExpanded ? "true" : "false",
                );
                setTextContent(button, isExpanded ? "收起详情" : "请求详情");
            }

            function sanitizeId(value) {
                return String(value).replace(/[^a-zA-Z0-9_-]/g, "-");
            }

            function formatInteger(value) {
                const number = Number(value);
                return Number.isFinite(number)
                    ? Math.round(number).toLocaleString("zh-CN")
                    : "-";
            }

            function formatCompactNumber(value) {
                const number = Number(value);
                if (!Number.isFinite(number)) return "-";
                const absolute = Math.abs(number);
                if (absolute >= 1000000) {
                    return `${stripTrailingZero(number / 1000000)}M`;
                }
                if (absolute >= 1000) {
                    return `${stripTrailingZero(number / 1000)}K`;
                }
                return String(Math.round(number));
            }

            function stripTrailingZero(value) {
                return value.toFixed(1).replace(/\.0$/, "");
            }

            function formatDecimal(value, digits) {
                if (value === null || value === undefined) return "-";
                const number = Number(value);
                return Number.isFinite(number) ? number.toFixed(digits) : "-";
            }

            function formatPercent(value) {
                if (value === null || value === undefined) return "-";
                const number = Number(value);
                return Number.isFinite(number)
                    ? `${(number * 100).toFixed(1)}%`
                    : "-";
            }

            function formatMilliseconds(value) {
                if (value === null || value === undefined) return "-";
                const number = Number(value);
                return Number.isFinite(number)
                    ? `${Math.round(number).toLocaleString("zh-CN")} ms`
                    : "-";
            }

            function formatCompactDuration(value) {
                if (value === null || value === undefined) return "-";
                const milliseconds = Number(value);
                if (!Number.isFinite(milliseconds)) return "-";
                if (milliseconds < 1000) {
                    return `${Math.round(milliseconds)}ms`;
                }
                const seconds = milliseconds / 1000;
                if (seconds < 60) {
                    return `${stripTrailingZero(seconds)}s`;
                }
                const minutes = seconds / 60;
                if (minutes < 60) {
                    return `${stripTrailingZero(minutes)}m`;
                }
                return `${stripTrailingZero(minutes / 60)}h`;
            }

            function formatThroughput(metrics) {
                const value = metrics.throughput?.paragraphsPerMinute;
                if (value === null || value === undefined) return "计算中";
                return `${formatDecimal(value, 1)} 段/分钟`;
            }

            function formatEta(metrics) {
                const value = metrics.throughput?.etaSeconds;
                if (value === null || value === undefined) return "计算中";
                const seconds = Math.max(Math.round(Number(value)), 0);
                if (!Number.isFinite(seconds)) return "计算中";
                if (seconds < 60) return `${seconds} 秒`;
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60) return `${minutes} 分 ${seconds % 60} 秒`;
                const hours = Math.floor(minutes / 60);
                return `${hours} 小时 ${minutes % 60} 分`;
            }

            function formatCost(metrics) {
                const cost = metrics.cost;
                if (
                    !cost ||
                    cost.amount === null ||
                    cost.amount === undefined
                ) {
                    return "无法估算";
                }
                const marker = cost.accuracy === "fallback" ? "≈" : "";
                return `${marker}${cost.currency || "CNY"} ${Number(cost.amount).toFixed(4)}`;
            }

            function formatCostNote(metrics) {
                const cost = metrics.cost;
                if (!cost || cost.accuracy === "unavailable") {
                    return "费用无法估算：当前模型没有已知费率，请在 DeepSeek extraData 中配置费率。";
                }
                const accuracy =
                    cost.accuracy === "fallback"
                        ? "输入 token 缺少缓存拆分，已按未命中费率保守估算"
                        : "按 DeepSeek 返回的缓存命中、未命中和输出 token 估算";
                const pricingVersion = cost.pricingVersion || "custom";
                const sourceLabels = {
                    custom: "用户配置",
                    remote: "自动更新",
                    bundled: "内置规则",
                };
                const sourceKey =
                    cost.pricingSource ||
                    (pricingVersion.includes("-tiered")
                        ? "bundled"
                        : "custom");
                const source = sourceLabels[sourceKey] || "未知来源";
                const updatedAt = cost.pricingUpdatedAt
                    ? `；规则更新时间 ${cost.pricingUpdatedAt}`
                    : "";
                const schedule = pricingVersion.includes("-tiered")
                    ? "；高峰价仅适用于北京时间周一至周五 09:00–12:00、14:00–18:00"
                    : "";
                return `${accuracy}；费率版本 ${pricingVersion}；来源 ${source}${updatedAt}${schedule}。`;
            }

            function formatDiagnostics(diagnostics) {
                if (!Array.isArray(diagnostics) || diagnostics.length === 0) {
                    return "";
                }
                return diagnostics
                    .map((diagnostic) => {
                        const line = [
                            `[${diagnostic.severity || "info"}]`,
                            diagnostic.code || "diagnostic",
                            diagnostic.message || "",
                        ]
                            .filter(Boolean)
                            .join(" ");
                        if (diagnostic.suggestion) {
                            return `${line}\n建议: ${diagnostic.suggestion}`;
                        }
                        return line;
                    })
                    .join("\n");
            }

            function canDelete(task) {
                if (task.status === "failed" || task.status === "cancelled") {
                    return true;
                }
                return (
                    task.status === "completed" &&
                    task.importState !== "pending" &&
                    task.importState !== "importing"
                );
            }

            function canCancelTask(task) {
                if (!task || !task.canCancel) return false;
                return (
                    task.status === "queued" ||
                    task.status === "running" ||
                    task.status === "cancelling"
                );
            }

            function canRetry(task) {
                if (task.status === "failed") {
                    return true;
                }
                return (
                    task.status === "completed" && task.importState === "failed"
                );
            }

            function formatDate(value) {
                if (!value) return "-";
                try {
                    return new Date(value).toLocaleString();
                } catch (_error) {
                    return value;
                }
            }

        </script>
