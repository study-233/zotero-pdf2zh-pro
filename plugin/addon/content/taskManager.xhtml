        <style>
            :root {
                --surface: #fbfbfa;
                --surface-subtle: #f5f6f7;
                --surface-hover: rgba(38, 49, 72, 0.06);
                --text-primary: #0f1115;
                --text-secondary: #61666b;
                --text-tertiary: #81858c;
                --border: rgba(15, 17, 21, 0.12);
                --border-strong: rgba(15, 17, 21, 0.18);
                --accent: #4176e6;
                --primary: #0f1115;
                --primary-hover: #43454a;
                --primary-text: #ffffff;
                --focus-ring: rgba(65, 118, 230, 0.28);
                --ease: cubic-bezier(0.4, 0, 0.2, 1);
            }

            body {
                margin: 0;
                padding: 14px;
                background: #ececea;
                color: #1f2328;
                font:
                    13px/1.4 -apple-system,
                    BlinkMacSystemFont,
                    "SF Pro Text",
                    "Segoe UI",
                    sans-serif;
            }

            .page {
                display: flex;
                flex-direction: column;
                gap: 10px;
                min-width: 0;
            }

            .toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                padding: 10px 12px;
                background: #fbfbfa;
                border: 1px solid #d6d6d2;
                border-radius: 8px;
            }

            .title {
                font-size: 15px;
                font-weight: 650;
            }

            .toolbar-actions {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .connection {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                min-height: 28px;
                padding: 0 9px;
                border: 1px solid #d6d6d2;
                border-radius: 8px;
                background: #f7f7f5;
                color: #4f565f;
                white-space: nowrap;
            }

            .connection-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #8b949e;
            }

            .connection.connected .connection-dot,
            .connection.open .connection-dot {
                background: #1a7f37;
            }

            .connection.connecting .connection-dot {
                background: #bf8700;
            }

            .connection.closed .connection-dot,
            .connection.error .connection-dot {
                background: #cf222e;
            }

            .button {
                border: 1px solid #c8c8c3;
                background: #fff;
                color: #1f2328;
                border-radius: 8px;
                padding: 5px 9px;
                cursor: pointer;
                font: inherit;
                min-height: 28px;
            }

            .button:hover:not(:disabled) {
                background: var(--surface-hover);
                border-color: #9fa6ad;
            }

            .button:focus-visible,
            .segment:focus-visible,
            .metrics-details summary:focus-visible,
            .metric-rail:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
                box-shadow: 0 0 0 3px var(--focus-ring);
            }

            .button:disabled {
                cursor: default;
                opacity: 0.55;
            }

            .button.danger {
                border-color: #e2aaa6;
                color: #a40e26;
                background: #fff8f7;
            }

            .button.primary {
                border-color: var(--primary);
                color: var(--primary-text);
                background: var(--primary);
            }

            .button.primary:hover:not(:disabled) {
                border-color: var(--primary-hover);
                background: var(--primary-hover);
            }

            .control-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 8px 10px;
                background: #fbfbfa;
                border: 1px solid #d6d6d2;
                border-radius: 8px;
            }

            .segmented {
                display: inline-flex;
                padding: 2px;
                gap: 2px;
                background: #e7e7e4;
                border: 1px solid #d1d1cd;
                border-radius: 8px;
            }

            .segment {
                min-height: 26px;
                border: 0;
                border-radius: 6px;
                background: transparent;
                color: #4f565f;
                cursor: pointer;
                font: inherit;
                padding: 4px 10px;
                white-space: nowrap;
            }

            .segment.active {
                background: #fff;
                color: #1f2328;
                box-shadow: 0 1px 2px rgba(27, 31, 36, 0.12);
            }

            .list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .card {
                background: #fbfbfa;
                border: 1px solid #d6d6d2;
                border-radius: 8px;
                padding: 10px 12px;
            }

            .card-header {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                align-items: flex-start;
            }

            .task-title {
                min-width: 0;
            }

            .name {
                font-weight: 650;
                word-break: break-word;
            }

            .meta {
                color: #656b73;
                font-size: 12px;
                margin-top: 1px;
            }

            .status {
                padding: 3px 7px;
                border-radius: 8px;
                font-size: 12px;
                background: #ececeb;
                white-space: nowrap;
            }

            .status.running {
                background: #e7f1ff;
                color: #1c5fb8;
            }

            .status.cancelling {
                background: #fff0cf;
                color: #8a5b00;
            }

            .status.completed {
                background: #e8f7eb;
                color: #216e39;
            }

            .status.incomplete,
            .status.failed,
            .status.cancelled {
                background: #fdecec;
                color: #af2b2b;
            }

            .grid {
                margin-top: 9px;
                display: grid;
                grid-template-columns: 1.1fr 1fr 0.8fr 1fr 0.7fr;
                gap: 8px;
            }

            .metric-label {
                color: #656b73;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.03em;
            }

            .metric-value {
                margin-top: 1px;
                font-weight: 600;
                word-break: break-word;
                font-variant-numeric: tabular-nums;
            }

            .progress {
                margin-top: 9px;
            }

            .progress-track {
                height: 7px;
                border-radius: 8px;
                background: #ececeb;
                overflow: hidden;
            }

            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #2563eb, #16836b);
                border-radius: 8px;
                transition: width 160ms var(--ease);
            }

            .observability-summary,
            .observability-detail-grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 8px;
            }

            .observability-summary {
                margin-top: 9px;
                padding: 8px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface-subtle);
            }

            .observability-item {
                min-width: 0;
            }

            .metrics-details {
                margin-top: 6px;
                border-top: 1px solid var(--border);
            }

            .metrics-details summary {
                width: max-content;
                margin-top: 6px;
                color: var(--text-secondary);
                cursor: pointer;
                border-radius: 6px;
                padding: 3px 6px;
                list-style-position: inside;
                user-select: none;
            }

            .metrics-details summary:hover {
                background: var(--surface-hover);
                color: var(--text-primary);
            }

            .observability-detail-grid {
                margin-top: 4px;
                padding: 8px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface);
            }

            .progress-meta {
                margin-top: 5px;
                display: flex;
                justify-content: space-between;
                gap: 12px;
                font-size: 12px;
                color: #555;
            }

            .actions {
                margin-top: 9px;
                display: flex;
                justify-content: flex-end;
                gap: 6px;
                flex-wrap: wrap;
            }

            .empty {
                border: 1px dashed #ccccca;
                border-radius: 8px;
                padding: 22px;
                text-align: center;
                color: #656b73;
                background: rgba(255, 255, 255, 0.5);
            }

            @media (max-width: 900px) {
                body {
                    padding: 10px;
                }

                .page {
                    min-width: 0;
                }

                .control-bar {
                    align-items: stretch;
                    flex-direction: column;
                }

                .toolbar-actions {
                    justify-content: flex-start;
                }

                .grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                .observability-summary,
                .observability-detail-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                .progress-meta {
                    flex-direction: column;
                    gap: 2px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    scroll-behavior: auto !important;
                    transition-duration: 0.01ms !important;
                    animation-duration: 0.01ms !important;
                }
            }
        </style>

                justify-content: flex-end;
                margin-left: auto;
                max-width: 100%;
                align-items: center;
                gap: 6px;
            }

            .task-footer .button {
                flex: 0 0 auto;
                min-height: 28px;
                padding: 0 10px;
                font-size: 12px;
                line-height: 18px;
            }

            .task-footer .metrics-toggle {
                border-color: var(--accent-tint);
                background: var(--accent-tint);
                color: var(--accent);
            }

            .task-footer .metrics-toggle:hover:not(:disabled) {
                border-color: var(--accent);
                background: var(--accent-tint);
            }

            .progress-meta {
                margin-top: 6px;
                color: var(--text-tertiary);
                font-size: 11px;
                line-height: 16px;
                flex-wrap: wrap;
            }

            .task-toolbar {
                display: grid;
                gap: 12px;
                padding: 14px 16px;
                border-bottom: 1px solid var(--border);
            }
            .history-pager {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                gap: 8px;
                padding: 4px 0;
                color: var(--text-secondary);
                font-variant-numeric: tabular-nums;
            }
            .history-pager .button {
                min-width: 28px;
                min-height: 28px;
                padding: 0 8px;
                border: 0;
                background: transparent;
            }
            .speed-detail {
                margin-top: 8px;
                color: var(--text-tertiary);
                font-size: 12px;
                line-height: 1.5;
            }

            .error {
                margin: 0 16px 12px;
                padding: 8px 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface-subtle);
                color: var(--text-primary);
                font-size: 12px;
                font-weight: 600;
                line-height: 18px;
            }

            .empty {
                padding: 48px 24px;
                border-color: var(--border-strong);
                border-radius: 12px;
                background: var(--surface);
                color: var(--text-secondary);
                box-shadow: var(--shadow-1);
            }

            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                border-radius: 4px;
                background: var(--border-strong);
            }

            @media (max-width: 900px) {
                body {
                    padding: 12px;
                }

                .observability-detail-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                .task-metric:nth-child(odd) {
                    border-left: 0;
                }

                .task-metric:nth-child(n + 3) {
                    border-top: 1px solid var(--border);
                }

                .task-metric:last-child {
                    grid-column: 1 / -1;
                    display: flex;
                    align-items: baseline;
                    gap: 8px;
                }

                .task-metric:last-child .metric-value {
                    margin-top: 0;
                }

                .observability-item:nth-child(odd) {
                    border-left: 0;
                }

                .observability-item:nth-child(n + 3) {
                    border-top: 1px solid var(--border);
                }

                .observability-detail-grid .observability-item:nth-child(even) {
                    border-left: 1px solid var(--border);
                }
            }

            @media (max-width: 620px) {
                .toolbar {
                    padding: 12px;
                    flex-direction: row;
                    align-items: center;
                    gap: 12px;
                }

                .heading {
                    align-items: flex-start;
                    flex-direction: column;
                    gap: 4px;
                }

                .segmented {
                    max-width: 100%;
                    flex-wrap: wrap;
                }

                .batch-actions {
                    gap: 6px;
                }

                .batch-actions .danger {
                    margin-left: 0;
                }

                .control-bar {
                    position: static;
                }

                .card-header {
                    align-items: flex-start;
                }

                .name,
                .meta {
                    white-space: normal;
                }

                .task-footer {
                    align-items: stretch;
                    flex-direction: column;
                    gap: 8px;
                }

                .metric-rail {
                    width: 100%;
                    flex-basis: auto;
                }

                .footer-actions {
                    justify-content: flex-end;
                }
            }

            @media (max-width: 420px) {
                .segmented {
                    display: grid;
                    width: 100%;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <header class="task-toolbar">
                <div class="toolbar">
                    <div class="heading">
                        <div class="title" data-message="title" />
                        <div
                            id="connection-status"
                            class="connection unknown"
                            role="status"
                        >
                            <span class="connection-dot" aria-hidden="true" />
                            <span id="connection-label" />
                        </div>
                    </div>
                    <div class="toolbar-actions">
                        <button
                            id="refresh-btn"
                            class="button"
                            data-message="refresh"
                        />
                        <button
                            id="close-btn"
                            class="button"
                            data-message="close"
                        />
                    </div>
                </div>
                <div class="control-bar">
                    <div id="filter-control" class="segmented" role="tablist">
                        <button
                            class="segment active"
                            data-filter="all"
                            role="tab"
                        >
                            <span data-message="all" />
                            <span id="filter-count-all" class="segment-count"
                                >0</span
                            >
                        </button>
                        <button class="segment" data-filter="active" role="tab">
                            <span data-message="active" />
                            <span id="filter-count-active" class="segment-count"
                                >0</span
                            >
                        </button>
                        <button class="segment" data-filter="failed" role="tab">
                            <span data-message="failed" />
                            <span id="filter-count-failed" class="segment-count"
                                >0</span
                            >
                        </button>
                        <button
                            class="segment"
                            data-filter="completed"
                            role="tab"
                        >
                            <span data-message="completed" />
                            <span
                                id="filter-count-completed"
                                class="segment-count"
                                >0</span
                            >
                        </button>
                    </div>
                    <div class="batch-actions">
                        <button
                            id="resume-queue-btn"
                            class="button"
                            data-message="resume-queue"
                        />
                        <button
                            id="retry-all-failed-btn"
                            class="button"
                            data-message="retry-page"
                        />
                        <button
                            id="clear-failed-btn"
                            class="button danger"
                            data-message="clear-failed"
                            data-message-title="clear-failed-scope"
                        />
                    </div>
                </div>
            </header>
            <div id="operation-notice" hidden="hidden" />
            <div id="server-notice" hidden="hidden" />
            <section
                id="submission"
                hidden="hidden"
                style="margin-bottom: 16px; overflow-wrap: anywhere"
            >
                <div id="submission-notice" />
                <div id="submission-warnings" />
                <details id="submission-details" hidden="hidden">
                    <summary id="submission-summary" />
                    <ul id="submission-errors" />
                </details>
            </section>
            <div id="task-list" class="list"></div>
            <nav
                id="history-pager"
                class="history-pager"
                hidden="hidden"
                data-message-title="history-navigation"
            >
                <button
                    id="history-prev"
                    class="button"
                    data-message-title="previous"
                    data-message-aria="previous"
                >
                    ‹
                </button>
                <span id="history-label" aria-live="polite"></span>
                <button
                    id="history-next"
                    class="button"
                    data-message-title="next"
                    data-message-aria="next"
                >
                    ›
                </button>
            </nav>
        </div>

        <script>
            // <![CDATA[
            let api;
            let unsubscribeTasksChanged = null;
            let currentTasks = [];
            let currentFilter = "all";
            const expandedMetricTaskIds = new Set();
            const taskCardViews = new Map();
            let emptyStateNode = null;
            let pendingRenderTasks = null;
            let renderFrameId = null;
            let submissionSignature;

            function t(key, args) {
                return api.message(`task-ui-${key}`, { args });
            }

            function reportOperation(
                error,
                node = document.getElementById("operation-notice"),
            ) {
                if (!node || !api?.renderNotice) return;
                api.renderNotice(
                    node,
                    error ? api.errorNotice(error) : null,
                    api.noticeAction,
                );
            }

            function renderSubmission() {
                if (!api?.getSubmission) return;
                const state = api.getSubmission();
                const signature = JSON.stringify(state);
                if (signature === submissionSignature) return;
                submissionSignature = signature;
                const section = document.getElementById("submission");
                section.hidden = !state;
                if (!state) return;
                api.renderNotice(
                    document.getElementById("submission-notice"),
                    state.notice,
                    api.noticeAction,
                );
                document.getElementById("submission-warnings").textContent =
                    state.warnings.join(" ");
                document.getElementById("submission-details").hidden =
                    !state.errors.length;
                document.getElementById("submission-summary").textContent =
                    api.message("notice-submission-errors", {
                        args: { count: state.errors.length },
                    });
                const list = document.getElementById("submission-errors");
                list.replaceChildren();
                for (const error of state.errors) {
                    const li = document.createElement("li");
                    li.textContent = `${error.fileName} — ${error.text}`;
                    list.append(li);
                }
            }

            document.addEventListener("DOMContentLoaded", async () => {
                api = window.arguments && window.arguments[0];
                if (!api) return;
                document.title = t("window-title");
                document.documentElement.lang = api.locale || "zh-CN";
                document.querySelectorAll("[data-message]").forEach((node) => {
                    node.textContent = t(node.dataset.message);
                });
                document
                    .querySelectorAll("[data-message-title]")
                    .forEach((node) => {
                        node.title = t(node.dataset.messageTitle);
                    });
                document
                    .querySelectorAll("[data-message-aria]")
                    .forEach((node) => {
                        node.setAttribute(
                            "aria-label",
                            t(node.dataset.messageAria),
                        );
                    });
                if (api && api._initPromise) {
                    api._initPromise.resolve();
                }
                if (api && api.onTasksChanged) {
                    unsubscribeTasksChanged = api.onTasksChanged(() => {
                        scheduleRender(api.getTasks());
                    });
                }

                document
                    .getElementById("filter-control")
                    .addEventListener("click", (event) => {
                        const button = event.target.closest(
                            "button[data-filter]",
                        );
                        if (!button) return;
                        currentFilter = button.getAttribute("data-filter");
                        render(currentTasks);
                    });

                document
                    .getElementById("retry-all-failed-btn")
                    .addEventListener("click", async () => {
                        await retryAllFailed();
                    });
                document
                    .getElementById("clear-failed-btn")
                    .addEventListener("click", async () => {
                        try {
                            reportOperation(null);
                            await api.clearFailedTasks();
                            render(api.getTasks());
                            void refresh();
                        } catch (error) {
                            reportOperation(error);
                        }
                    });
                document
                    .getElementById("refresh-btn")
                    .addEventListener("click", () => void refresh());
                document
                    .getElementById("resume-queue-btn")
                    .addEventListener("click", async (event) => {
                        event.currentTarget.disabled = true;
                        reportOperation(null);
                        try {
                            await api.resumeTasks();
                        } catch (error) {
                            reportOperation(error);
                        } finally {
                            await refresh();
                        }
                    });
                document
                    .getElementById("close-btn")
                    .addEventListener("click", () => window.close());

                for (const [id, direction] of [
                    ["history-prev", -1],
                    ["history-next", 1],
                ]) {
                    document
                        .getElementById(id)
                        .addEventListener("click", async () => {
                            reportOperation(null);
                            try {
                                await api.changeHistoryPage(direction);
                            } catch (error) {
                                reportOperation(error);
                            }
                            render(api.getTasks());
                        });
                }
                await refresh();
            });

            window.addEventListener("unload", () => {
                if (renderFrameId !== null) {
                    window.cancelAnimationFrame(renderFrameId);
                    renderFrameId = null;
                }
                if (unsubscribeTasksChanged) {
                    unsubscribeTasksChanged();
                    unsubscribeTasksChanged = null;
                }
            });

            async function refresh() {
                if (!api) return;
                try {
                    await api.refreshTasks();
                    scheduleRender(api.getTasks());
                } catch (error) {
                    reportOperation(error);
                }
            }

            function scheduleRender(tasks) {
                pendingRenderTasks = tasks || [];
                if (renderFrameId !== null) return;
                renderFrameId = window.requestAnimationFrame(() => {
                    renderFrameId = null;
                    const latestTasks = pendingRenderTasks || [];
                    pendingRenderTasks = null;
                    render(latestTasks);
                });
            }

            function render(tasks) {
                renderSubmission();
                if (api?.getServerNotice && api?.renderNotice)
                    api.renderNotice(
                        document.getElementById("server-notice"),
                        api.getServerNotice() || null,
                        api.noticeAction,
                    );
                const root = document.getElementById("task-list");
                currentTasks = tasks || [];
                updateConnectionStatus();
                const history = api?.getHistoryPage?.();
                const pager = document.getElementById("history-pager");
                pager.hidden =
                    !history?.supported ||
                    (!history.total && history.page <= 1);
                if (history) {
                    document.getElementById("history-label").textContent = t(
                        "history",
                        { page: history.page, total: history.total },
                    );
                    document.getElementById("history-prev").disabled =
                        history.loading || history.page <= 1;
                    document.getElementById("history-next").disabled =
                        history.loading || !history.hasMore;
                }
                renderFilterCounts(currentTasks);
                renderFilterButtons();

                const currentTaskIds = new Set(
                    currentTasks.map((task) => task.taskId),
                );
                taskCardViews.forEach((view, taskId) => {
                    if (currentTaskIds.has(taskId)) return;
                    view.card.remove();
                    taskCardViews.delete(taskId);
                    expandedMetricTaskIds.delete(taskId);
                });

                const filteredTasks = currentTasks.filter(matchesCurrentFilter);

                if (filteredTasks.length === 0) {
                    if (!emptyStateNode) {
                        emptyStateNode = document.createElement("div");
                        emptyStateNode.className = "empty";
                    }
                    setTextContent(
                        emptyStateNode,
                        currentTasks.length === 0
                            ? t("empty")
                            : t("empty-filter"),
                    );
                    Array.from(root.children).forEach((child) => {
                        if (child !== emptyStateNode) child.remove();
                    });
                    if (emptyStateNode.parentNode !== root) {
                        root.appendChild(emptyStateNode);
                    }
                    return;
                }

                const visibleTaskIds = new Set(
                    filteredTasks.map((task) => task.taskId),
                );
                Array.from(root.children).forEach((child) => {
                    if (!visibleTaskIds.has(child.dataset.taskId)) {
                        child.remove();
                    }
                });

                filteredTasks.forEach((task, index) => {
                    let view = taskCardViews.get(task.taskId);
                    if (!view) {
                        view = createTaskCardView(task);
                        taskCardViews.set(task.taskId, view);
                    }

                    const signature =
                        view.task === task
                            ? view.signature
                            : getTaskRenderSignature(task);
                    if (view.signature !== signature) {
                        updateTaskCardView(view, task);
                        view.signature = signature;
                    } else {
                        view.task = task;
                    }

                    const currentNode = root.children[index] || null;
                    if (currentNode !== view.card) {
                        root.insertBefore(view.card, currentNode);
                    }
                });

                while (root.children.length > filteredTasks.length) {
                    root.lastElementChild.remove();
                }
            }

            function createTaskCardView(task) {
                const view = {
                    task: null,
                    signature: null,
                    pendingAction: null,
                };
                const card = document.createElement("div");
                card.dataset.taskId = task.taskId;

                const header = document.createElement("div");
                header.className = "card-header";
                const titleWrap = document.createElement("div");
                titleWrap.className = "task-title";
                const name = document.createElement("div");
                name.className = "name";
                const meta = document.createElement("div");
                meta.className = "meta";
                const status = document.createElement("div");
                titleWrap.appendChild(name);
                titleWrap.appendChild(meta);
                header.appendChild(titleWrap);
                header.appendChild(status);
                card.appendChild(header);

                const grid = document.createElement("div");
                grid.className = "grid";
                const gridValues = [
                    t("stage"),
                    t("stage-progress"),
                    t("overall-progress"),
                    t("import-state"),
                    t("attempt"),
                ].map((label) => {
                    const box = document.createElement("div");
                    box.className = "task-metric";
                    const labelEl = document.createElement("div");
                    labelEl.className = "metric-label";
                    labelEl.textContent = label;
                    const valueEl = document.createElement("div");
                    valueEl.className = "metric-value";
                    box.appendChild(labelEl);
                    box.appendChild(valueEl);
                    grid.appendChild(box);
                    return valueEl;
                });
                card.appendChild(grid);

                const progress = document.createElement("div");
                progress.className = "progress";
                const progressTrack = document.createElement("div");
                progressTrack.className = "progress-track";
                progressTrack.setAttribute("role", "progressbar");
                progressTrack.setAttribute("aria-label", t("progress-label"));
                progressTrack.setAttribute("aria-valuemin", "0");
                progressTrack.setAttribute("aria-valuemax", "100");
                const progressFill = document.createElement("div");
                progressFill.className = "progress-fill";
                progressTrack.appendChild(progressFill);
                progress.appendChild(progressTrack);
                const metaRow = document.createElement("div");
                metaRow.className = "progress-meta";
                const createdAt = document.createElement("span");
                const updatedAt = document.createElement("span");
                metaRow.appendChild(createdAt);
                metaRow.appendChild(updatedAt);
                progress.appendChild(metaRow);
                card.appendChild(progress);

                const qualitySummary = document.createElement("div");
                qualitySummary.className = "quality-summary";
                qualitySummary.hidden = true;
                card.appendChild(qualitySummary);

                const error = document.createElement("div");
                error.className = "error";
                error.hidden = true;
                card.appendChild(error);
                const actionNotice = document.createElement("div");
                actionNotice.className = "error";
                actionNotice.hidden = true;
                card.appendChild(actionNotice);

                const reloginButton = document.createElement("button");
                reloginButton.className = "button primary";
                reloginButton.textContent = t("login");
                reloginButton.addEventListener("click", () => {
                    if (!view.task) return;
                    reportOperation(null, actionNotice);
                    try {
                        api.reloginChatGPT(view.task.taskId);
                    } catch (errorValue) {
                        reportOperation(errorValue, actionNotice);
                    }
                });
                card.appendChild(reloginButton);

                const metricsPanel = document.createElement("div");
                metricsPanel.className = "metrics-panel";
                metricsPanel.id = `metrics-panel-${sanitizeId(task.taskId)}`;
                metricsPanel.hidden = true;
                const detailGrid = document.createElement("div");
                detailGrid.className = "observability-detail-grid";
                const detailValues = [
                    t("qps"),
                    t("active-requests"),
                    t("average-latency"),
                    t("p95-latency"),
                    t("retries"),
                    t("local-cache"),
                    t("provider-cache-rate"),
                    t("tokens"),
                    t("references-skipped"),
                    t("throughput"),
                    t("queue"),
                    t("execution"),
                ].map((label) => appendMetric(detailGrid, label, "-"));
                metricsPanel.appendChild(detailGrid);
                const speedDetail = document.createElement("div");
                speedDetail.className = "speed-detail";
                speedDetail.textContent = t("output-speed-help");
                metricsPanel.appendChild(speedDetail);
                const qualityDetail = document.createElement("div");
                qualityDetail.className = "review-detail";
                metricsPanel.appendChild(qualityDetail);
                card.appendChild(metricsPanel);

                const footer = document.createElement("div");
                footer.className = "task-footer";
                const metricRail = document.createElement("div");
                metricRail.className = "metric-rail";
                metricRail.tabIndex = 0;
                metricRail.setAttribute("role", "region");
                metricRail.setAttribute("aria-label", t("metrics-label"));
                const timingMetric = appendSummaryMetric(
                    metricRail,
                    t("elapsed"),
                    "—",
                );
                const metricEmpty = document.createElement("span");
                metricEmpty.className = "metric-empty";
                metricRail.appendChild(metricEmpty);
                timingMetric.item.setAttribute("title", t("timing-help"));
                const summaryMetrics = [
                    t("eta"),
                    t("output-speed"),
                    t("tokens"),
                    t("provider-cache"),
                    t("requests-retries"),
                    t("latency"),
                ].map((label) => appendSummaryMetric(metricRail, label, "-"));
                footer.appendChild(metricRail);

                const footerActions = document.createElement("div");
                footerActions.className = "footer-actions";
                const metricsToggle = document.createElement("button");
                metricsToggle.className = "button metrics-toggle";
                metricsToggle.setAttribute("aria-controls", metricsPanel.id);
                metricsToggle.addEventListener("click", () => {
                    const currentTask = view.task;
                    if (
                        !currentTask?.metrics &&
                        !currentTask?.qualitySummary &&
                        !currentTask?.timing
                    )
                        return;
                    const isExpanded = metricsPanel.hidden;
                    metricsPanel.hidden = !isExpanded;
                    if (isExpanded) {
                        expandedMetricTaskIds.add(currentTask.taskId);
                    } else {
                        expandedMetricTaskIds.delete(currentTask.taskId);
                    }
                    updateMetricsToggle(metricsToggle, isExpanded);
                });
                footerActions.appendChild(metricsToggle);

                const exportButton = document.createElement("button");
                exportButton.className = "button";
                exportButton.textContent = t("export");
                exportButton.addEventListener("click", async () => {
                    exportButton.disabled = true;
                    reportOperation(null, actionNotice);
                    try {
                        await api.exportDiagnostics(view.task.taskId);
                    } catch (error) {
                        reportOperation(error, actionNotice);
                    } finally {
                        exportButton.disabled = false;
                    }
                });
                footerActions.appendChild(exportButton);
                const cancelButton = document.createElement("button");
                cancelButton.className = "button danger";
                cancelButton.textContent = t("cancel");
                cancelButton.addEventListener("click", async () => {
                    const currentTask = view.task;
                    if (!canCancelTask(currentTask)) return;
                    view.pendingAction = "cancel";
                    cancelButton.disabled = true;
                    reportOperation(null, actionNotice);
                    try {
                        await api.cancelTask(currentTask.taskId);
                        view.pendingAction = null;
                        await refresh();
                    } catch (errorValue) {
                        view.pendingAction = null;
                        reportOperation(errorValue, actionNotice);
                        cancelButton.disabled = false;
                    }
                });
                footerActions.appendChild(cancelButton);

                const retryButton = document.createElement("button");
                retryButton.className = "button";
                retryButton.addEventListener("click", async () => {
                    const currentTask = view.task;
                    if (!currentTask) return;
                    view.pendingAction = "retry";
                    retryButton.disabled = true;
                    reportOperation(null, actionNotice);
                    try {
                        await api.retryTask(currentTask.taskId);
                        view.pendingAction = null;
                        render(api.getTasks());
                    } catch (errorValue) {
                        view.pendingAction = null;
                        reportOperation(errorValue, actionNotice);
                        retryButton.disabled = false;
                    }
                });
                footerActions.appendChild(retryButton);

                const resumeButton = document.createElement("button");
                resumeButton.className = "button primary";
                resumeButton.textContent = t("resume");
                resumeButton.addEventListener("click", async () => {
                    view.pendingAction = "resume";
                    resumeButton.disabled = true;
                    reportOperation(null, actionNotice);
                    try {
                        await api.resumeTask(view.task.taskId);
                    } catch (error) {
                        reportOperation(error, actionNotice);
                    } finally {
                        view.pendingAction = null;
                        await refresh();
                    }
                });
                footerActions.appendChild(resumeButton);

                const memorySyncButton = document.createElement("button");
                memorySyncButton.className = "button";
                memorySyncButton.textContent = api.message(
                    "task-memory-sync-retry",
                );
                memorySyncButton.addEventListener("click", async () => {
                    view.pendingAction = "memory-sync";
                    memorySyncButton.disabled = true;
                    reportOperation(null, actionNotice);
                    try {
                        await api.retryMemorySync(view.task.taskId);
                    } catch (error) {
                        reportOperation(error, actionNotice);
                    } finally {
                        view.pendingAction = null;
                        await refresh();
                    }
                });
                footerActions.appendChild(memorySyncButton);

                const repairButton = document.createElement("button");
                repairButton.className = "button primary";
                repairButton.addEventListener("click", async () => {
                    if (!view.task) return;
                    view.pendingAction = "repair";
                    repairButton.disabled = true;
                    reportOperation(null, actionNotice);
                    try {
                        await api.repairTask(view.task.taskId);
                        view.pendingAction = null;
                        render(api.getTasks());
                    } catch (errorValue) {
                        view.pendingAction = null;
                        repairButton.disabled = false;
                        reportOperation(errorValue, actionNotice);
                    }
                });
                footerActions.appendChild(repairButton);
                const deleteButton = document.createElement("button");
                deleteButton.className = "button";
                deleteButton.textContent = t("delete");
                deleteButton.addEventListener("click", async () => {
                    const currentTask = view.task;
                    if (!currentTask) return;
                    view.pendingAction = "delete";
                    deleteButton.disabled = true;
                    reportOperation(null, actionNotice);
                    try {
                        await api.deleteTask(currentTask.taskId);
                        view.pendingAction = null;
                        render(api.getTasks());
                        void refresh();
                    } catch (errorValue) {
                        view.pendingAction = null;
                        reportOperation(errorValue, actionNotice);
                        deleteButton.disabled = false;
                    }
                });
                footerActions.appendChild(deleteButton);
                footer.appendChild(footerActions);
                card.appendChild(footer);

                Object.assign(view, {
                    card,
                    name,
                    meta,
                    status,
                    gridValues,
                    progressTrack,
                    progressFill,
                    createdAt,
                    updatedAt,
                    timingMetric,
                    speedDetail,
                    qualitySummary,
                    qualityDetail,
                    detailGrid,
                    error,
                    actionNotice,
                    reloginButton,
                    metricsPanel,
                    detailValues,
                    metricEmpty,
                    summaryMetrics,
                    metricsToggle,
                    cancelButton,
                    retryButton,
                    resumeButton,
                    memorySyncButton,
                    repairButton,
                    deleteButton,
                });
                updateTaskCardView(view, task);
                view.signature = getTaskRenderSignature(task);
                return view;
            }

            function updateTaskCardView(view, task) {
                view.task = task;
                setClassName(view.card, `card ${task.status}`);
                setTextContent(view.name, task.fileName);
                setAttributeValue(view.name, "title", task.fileName);
                setTextContent(
                    view.meta,
                    `${task.service} · ${task.outputModes.map((mode) => (["mono", "dual"].includes(mode) ? api.message(`attachment-type-${mode}`) : mode)).join(", ")} · ${task.source === "local" ? t("local") : t("remote")}`,
                );
                setClassName(view.status, `status ${task.status}`);
                setTextContent(view.status, formatStatus(task));
                setAttributeValue(
                    view.status,
                    "title",
                    formatStatusDetail(task),
                );

                const overallProgress = Math.max(
                    0,
                    Math.min(task.overallProgress || 0, 100),
                );
                const stageProgress = Math.max(
                    0,
                    Math.min(task.stageProgress || 0, 100),
                );
                const fontAssetStage = isFontAssetStage(task.stage);
                const displayedProgress = fontAssetStage
                    ? stageProgress
                    : overallProgress;
                const gridValues = [
                    task.queueBlocked
                        ? t("cancel-failed")
                        : task.status === "cancelling"
                          ? {
                                requested: t("cancel-requested"),
                                terminating: t("cancel-terminating"),
                                killing: t("cancel-killing"),
                            }[task.cancelPhase] || t("cancel-legacy")
                          : task.status === "running" &&
                              task.currentPage &&
                              task.stage ===
                                  "Parse PDF and Create Intermediate Representation"
                            ? t("parse-page", { page: task.currentPage })
                            : formatActivityStage(task),
                    formatStageProgress(task),
                    fontAssetStage
                        ? t("fonts-before-translation")
                        : `${Math.round(overallProgress)}%`,
                    formatImportState(task),
                    formatAttempt(task),
                ];
                view.gridValues.forEach((node, index) => {
                    setTextContent(node, gridValues[index]);
                });
                setAttributeValue(
                    view.progressTrack,
                    "aria-valuenow",
                    String(Math.round(displayedProgress)),
                );
                setAttributeValue(
                    view.progressTrack,
                    "aria-label",
                    fontAssetStage ? t("font-progress") : t("progress-label"),
                );
                const progressWidth = `${displayedProgress}%`;
                if (view.progressFill.style.width !== progressWidth) {
                    view.progressFill.style.width = progressWidth;
                }
                setTextContent(
                    view.createdAt,
                    t("created", { date: formatDate(task.createdAt) }),
                );
                setTextContent(
                    view.updatedAt,
                    t("updated", { date: formatDate(task.updatedAt) }),
                );
                setNodeHidden(view.timingMetric.item, !task.timing);
                setTextContent(
                    view.timingMetric.value,
                    formatTimingDuration(task.timing?.totalSeconds),
                );
                setTextContent(
                    view.timingMetric.label,
                    task.timing?.complete === false
                        ? t("timing-partial")
                        : t("elapsed"),
                );

                const qualityText = [
                    task.qualitySummary
                        ? t("review-summary", {
                              ...task.qualitySummary,
                              total:
                                  task.qualitySummary.selected +
                                  task.qualitySummary.notSelected,
                          })
                        : "",
                    task.translationMemorySync === "pending"
                        ? api.message("task-memory-sync-pending")
                        : "",
                ]
                    .filter(Boolean)
                    .join(" · ");
                setTextContent(view.qualitySummary, qualityText);
                setNodeHidden(view.qualitySummary, !qualityText);
                setTextContent(view.qualityDetail, qualitySummaryText(task));
                setNodeHidden(view.qualityDetail, !task.qualitySummary);

                const errorSummary = getErrorSummary(task);
                setTextContent(view.error, errorSummary);
                setNodeHidden(view.error, !errorSummary);
                setNodeHidden(
                    view.reloginButton,
                    !chatgptFailure(task)?.requiresLogin,
                );

                const metrics = task.metrics;
                const detailValues = [
                    formatDecimal(metrics?.requests?.qps10s, 2),
                    formatInteger(metrics?.requests?.active),
                    formatMilliseconds(metrics?.requests?.averageLatencyMs),
                    formatMilliseconds(metrics?.requests?.p95LatencyMs),
                    formatInteger(metrics?.requests?.retries),
                    formatPercent(metrics?.localCache?.hitRate),
                    formatPercent(metrics?.providerCache?.hitRate),
                    `${formatInteger(metrics?.tokens?.input)} / ${formatInteger(metrics?.tokens?.output)}`,
                    formatInteger(metrics?.referencesSkipped),
                    formatThroughput(metrics || {}),
                    formatTimingDuration(task.timing?.queueSeconds),
                    formatTimingDuration(task.timing?.executionSeconds),
                ];
                view.detailValues.forEach((node, index) => {
                    setTextContent(node, detailValues[index]);
                });

                if (metrics) {
                    const summaryValues = [
                        formatEta(metrics),
                        formatOutputSpeed(metrics),
                        `${formatCompactNumber(metrics.tokens?.input)} / ${formatCompactNumber(metrics.tokens?.output)}`,
                        formatPercent(metrics.providerCache?.hitRate),
                        `${formatCompactNumber(metrics.requests?.attempts)} / ${formatCompactNumber(metrics.requests?.retries)}`,
                        `${formatCompactDuration(metrics.requests?.averageLatencyMs)} / ${formatCompactDuration(metrics.requests?.p95LatencyMs)}`,
                    ];
                    view.summaryMetrics.forEach((summary, index) => {
                        setTextContent(summary.value, summaryValues[index]);
                        setNodeHidden(summary.item, false);
                    });
                    setNodeHidden(view.metricEmpty, true);
                } else {
                    view.summaryMetrics.forEach((summary) => {
                        setNodeHidden(summary.item, true);
                    });
                    setTextContent(
                        view.metricEmpty,
                        isActiveTask(task)
                            ? t("metrics-collecting")
                            : t("metrics-empty"),
                    );
                    setNodeHidden(view.metricEmpty, Boolean(task.timing));
                }
                const hasDetails = Boolean(
                    metrics || task.qualitySummary || task.timing,
                );
                const isExpanded =
                    hasDetails && expandedMetricTaskIds.has(task.taskId);
                setNodeHidden(view.detailGrid, !metrics && !task.timing);
                setNodeHidden(view.speedDetail, !metrics);
                setNodeHidden(view.metricsToggle, !hasDetails);
                setNodeHidden(view.metricsPanel, !isExpanded);
                updateMetricsToggle(view.metricsToggle, isExpanded);

                setNodeHidden(view.cancelButton, !canCancelTask(task));
                view.cancelButton.disabled = view.pendingAction === "cancel";
                setTextContent(
                    view.retryButton,
                    task.importState === "failed" && task.status !== "failed"
                        ? t("retry-import")
                        : t("retry"),
                );
                setNodeHidden(view.retryButton, !canRetry(task));
                setNodeHidden(
                    view.resumeButton,
                    !task.canResume || !api.resumeTask,
                );
                view.resumeButton.disabled = view.pendingAction === "resume";
                setNodeHidden(
                    view.memorySyncButton,
                    !task.canRetryMemorySync || !api.retryMemorySync,
                );
                view.memorySyncButton.disabled =
                    view.pendingAction === "memory-sync";
                view.retryButton.disabled = view.pendingAction === "retry";
                setTextContent(
                    view.repairButton,
                    task.status === "completed"
                        ? t("check-repair")
                        : t("repair"),
                );
                setNodeHidden(
                    view.repairButton,
                    !task.canRepair ||
                        !api.repairTask ||
                        Boolean(task.canResume),
                );
                view.repairButton.disabled = view.pendingAction === "repair";
                setNodeHidden(view.deleteButton, !canDelete(task));
                view.deleteButton.disabled =
                    view.pendingAction === "delete" ||
                    task.translationMemorySync === "pending";
                setAttributeValue(
                    view.deleteButton,
                    "title",
                    task.translationMemorySync === "pending"
                        ? t("memory-delete-wait")
                        : "",
                );
            }

            function getTaskRenderSignature(task) {
                return JSON.stringify([
                    task.fileName,
                    task.service,
                    task.outputModes,
                    task.status,
                    task.stage,
                    task.stageCurrent,
                    task.stageTotal,
                    task.stageProgress,
                    task.overallProgress,
                    task.error,
                    task.errorDiagnostics,
                    task.translationSummary,
                    task.translationMemorySync,
                    task.qualitySummary,
                    task.failedParagraphs,
                    task.canRepair,
                    task.attempt,
                    task.createdAt,
                    task.updatedAt,
                    task.canCancel,
                    task.source,
                    task.importState,
                    task.importError,
                    task.metrics,
                    task.recoveryState,
                    task.canResume,
                    task.timing,
                ]);
            }

            function formatTimingDuration(seconds) {
                return seconds === null || seconds === undefined
                    ? "—"
                    : formatCompactDuration(seconds * 1000);
            }

            function formatOutputSpeed(metrics) {
                const value = metrics.throughput?.outputTokensPerSecond;
                return value === null ||
                    value === undefined ||
                    !Number.isFinite(Number(value)) ||
                    Number(value) < 0
                    ? "—"
                    : `${formatDecimal(value, 1)} tokens/s`;
            }

            function setTextContent(node, value) {
                const nextValue = String(value ?? "");
                if (node.textContent !== nextValue) {
                    node.textContent = nextValue;
                }
            }

            function setClassName(node, value) {
                if (node.className !== value) {
                    node.className = value;
                }
            }

            function setAttributeValue(node, name, value) {
                if (node.getAttribute(name) !== value) {
                    node.setAttribute(name, value);
                }
            }

            function setNodeHidden(node, hidden) {
                if (node.hidden !== hidden) {
                    node.hidden = hidden;
                }
            }

            function renderFilterCounts(tasks) {
                const stats = {
                    total: tasks.length,
                    failed: tasks.filter(isFailedTask).length,
                    completed: tasks.filter(isCompletedTask).length,
                };
                setTextContent(
                    document.getElementById("filter-count-all"),
                    stats.total,
                );
                setTextContent(
                    document.getElementById("filter-count-active"),
                    tasks.filter(isActiveTask).length,
                );
                setTextContent(
                    document.getElementById("filter-count-failed"),
                    stats.failed,
                );
                setTextContent(
                    document.getElementById("filter-count-completed"),
                    stats.completed,
                );
                document.getElementById("retry-all-failed-btn").disabled =
                    stats.failed === 0 || !api;
                document.getElementById("resume-queue-btn").disabled =
                    !api?.resumeTasks || !tasks.some((task) => task.canResume);
                document.getElementById("clear-failed-btn").disabled = !(
                    api?.hasFailedTasks?.() ??
                    tasks.some((task) => task.status === "failed")
                );
            }

            function renderFilterButtons() {
                document
                    .querySelectorAll("#filter-control .segment")
                    .forEach((button) => {
                        const active =
                            button.getAttribute("data-filter") ===
                            currentFilter;
                        if (button.classList.contains("active") !== active) {
                            button.classList.toggle("active", active);
                        }
                        setAttributeValue(
                            button,
                            "aria-selected",
                            active ? "true" : "false",
                        );
                    });
            }

            function updateConnectionStatus() {
                const status = document.getElementById("connection-status");
                const label = document.getElementById("connection-label");
                const rawState =
                    api && typeof api.getEventStreamState === "function"
                        ? api.getEventStreamState()
                        : null;
                const state = normalizeEventStreamState(rawState);
                setClassName(status, `connection ${state.className}`);
                setTextContent(label, state.label);
                setAttributeValue(status, "title", state.detail || state.label);
            }

            async function retryAllFailed() {
                if (!api) return;
                const retryButton = document.getElementById(
                    "retry-all-failed-btn",
                );
                retryButton.disabled = true;
                reportOperation(null);
                try {
                    if (typeof api.retryFailedTasks === "function") {
                        await api.retryFailedTasks();
                    } else {
                        const failedTasks = currentTasks.filter(canRetry);
                        for (const task of failedTasks) {
                            await api.retryTask(task.taskId);
                        }
                    }
                    render(api.getTasks());
                    void refresh();
                } catch (error) {
                    reportOperation(error);
                    render(currentTasks);
                }
            }

            function matchesCurrentFilter(task) {
                if (currentFilter === "active") return isActiveTask(task);
                if (currentFilter === "failed") return isFailedTask(task);
                if (currentFilter === "completed") return isCompletedTask(task);
                return true;
            }

            function isActiveTask(task) {
                if (task.canResume) return false;
                return (
                    task.status === "queued" ||
                    task.status === "running" ||
                    task.status === "cancelling" ||
                    (hasImportResult(task) &&
                        (task.importState === "pending" ||
                            task.importState === "importing"))
                );
            }

            function hasImportResult(task) {
                return (
                    (task.status === "completed" &&
                        task.canDownloadResult !== false &&
                        !task.translationSummary?.failed &&
                        !task.translationSummary?.pending) ||
                    (task.status === "incomplete" &&
                        task.canDownloadResult === true &&
                        Object.values(task.resultFiles || {}).some(Boolean))
                );
            }

            function isFailedTask(task) {
                return (
                    task.status === "failed" ||
                    task.status === "incomplete" ||
                    (task.importState === "failed" && hasImportResult(task))
                );
            }

            function isCompletedTask(task) {
                return task.status === "completed";
            }

            function normalizeEventStreamState(rawState) {
                if (rawState === null || rawState === undefined)
                    return {
                        className: "unknown",
                        label: t("connection-unavailable"),
                    };
                if (typeof rawState === "object") {
                    const total = Number(rawState.total || 0);
                    const connected = Number(rawState.connected || 0);
                    const detail = t("connection-count", { connected, total });
                    if (!total)
                        return {
                            className: "closed",
                            label: t("connection-offline"),
                            detail,
                        };
                    if (rawState.hasErrors)
                        return {
                            className: "error",
                            label: t("connection-error"),
                            detail,
                        };
                    if (connected === total)
                        return {
                            className: "connected",
                            label: t("connection-connected"),
                            detail,
                        };
                    return {
                        className: "connecting",
                        label: t("connection-connecting"),
                        detail,
                    };
                }
                const mapping = {
                    open: ["connected", "connection-connected"],
                    connected: ["connected", "connection-connected"],
                    connecting: ["connecting", "connection-connecting"],
                    closed: ["closed", "connection-offline"],
                    disconnected: ["closed", "connection-offline"],
                    error: ["error", "connection-error"],
                };
                const [className, key] = mapping[
                    String(rawState).toLowerCase()
                ] || ["unknown", "connection-unavailable"];
                return { className, label: t(key) };
            }

            function formatStatus(task) {
                if (task.canResume) return t("paused");
                return t(
                    {
                        paused: "paused",
                        queued: "queued",
                        running: "running",
                        cancelling: "cancelling",
                        completed: "completed",
                        incomplete: "incomplete",
                        failed: "failed",
                        cancelled: "cancelled",
                    }[task.status] || "waiting",
                );
            }

            function formatStatusDetail(task) {
                if (task.canResume)
                    return task.recoveryState === "queued"
                        ? t("resume-queued")
                        : t("resume-interrupted");
                const mapping = {
                    paused: t("paused"),
                    queued: t("queued"),
                    running: t("running"),
                    cancelling: t("cancelling"),
                    completed: t("completed"),
                    incomplete:
                        task.qualitySummary?.failed > 0
                            ? t("incomplete-review", {
                                  count: task.qualitySummary.failed,
                              })
                            : t("incomplete-remaining", {
                                  count:
                                      (task.translationSummary?.failed || 0) +
                                          (task.translationSummary?.pending ||
                                              0) || t("unchecked"),
                              }),
                    failed: t("failed"),
                    cancelled: t("cancelled"),
                };
                if (task.status === "running" && isFontAssetStage(task.stage)) {
                    return t("fonts-initial");
                }
                if (task.status === "incomplete" && task.canDownloadResult) {
                    const prefix =
                        task.importState === "imported"
                            ? t("pdf-imported")
                            : t("pdf-generated");
                    return t("incomplete-result", {
                        result: prefix,
                        status: mapping.incomplete,
                    });
                }
                return mapping[task.status] || t("waiting");
            }

            function qualitySummaryText(task) {
                const quality = task.qualitySummary;
                if (!quality) return "";
                const total = quality.selected + quality.notSelected;
                return [
                    t("review-results", quality),
                    t("review-coverage", { ...quality, total }),
                    t("review-limit"),
                ].join("\n");
            }

            function isFontAssetStage(stage) {
                return stage === "Check Fonts" || stage === "Download Fonts";
            }

            function formatActivityStage(task) {
                const activity = task.metrics?.activity;
                if (
                    task.status === "running" &&
                    task.stage === "Translate Paragraphs" &&
                    activity
                ) {
                    if (activity.fallbackPending > 0)
                        return t("activity-split");
                    if (activity.retrying > 0) return t("activity-retry");
                    if (activity.oldestRequestSeconds != null)
                        return t("activity-response");
                    if (activity.queued > 0) return t("activity-queued");
                }
                return formatStage(task.stage);
            }

            function formatStage(stage) {
                const mapping = {
                    "Queue Wait": t("queued"),
                    "Engine Wait": t("engine-wait"),
                    Initialization: t("initializing"),
                    "Font Preparation": t("fonts-prepare"),
                    "Check Fonts": t("fonts-check"),
                    "Download Fonts": t("fonts-download"),
                    "Parse PDF and Create Intermediate Representation":
                        t("parse-document"),
                    DetectScannedFile: t("scan-detection"),
                    "Detect Scanned Pages": t("scan-detection"),
                    "Parse Page Layout": t("parse-layout"),
                    "Parse Table": t("parse-tables"),
                    "Parse Paragraphs": t("parse-paragraphs"),
                    "Parse Formulas and Styles": t("parse-formulas"),
                    "Automatic Term Extraction": t("extract-terms"),
                    "Extract Terms": t("extract-terms"),
                    "Translate Paragraphs": t("translate-body"),
                    "Semantic Review": t("review"),
                    Typesetting: t("typeset"),
                    "Document Layout": t("typeset"),
                    "Add Fonts": t("embed-fonts"),
                    "Generate drawing instructions": t("create-document"),
                    "Subset font": t("subset-fonts"),
                    "Save PDF": t("save-document"),
                    "Write PDF": t("save-document"),
                    Finalize: t("finalize"),
                    queued: t("queued"),
                    running: t("processing"),
                    cancelling: t("cancelling"),
                    completed: t("completed"),
                    incomplete: t("incomplete"),
                    failed: t("failed"),
                    cancelled: t("cancelled"),
                };
                if (!stage) return t("waiting");
                return Object.prototype.hasOwnProperty.call(mapping, stage)
                    ? mapping[stage]
                    : t("processing");
            }

            function formatStageProgress(task) {
                const progress = Math.round(task.stageProgress || 0);
                const current = task.stageCurrent || 0;
                const total = task.stageTotal || 0;
                if (
                    task.status === "running" &&
                    task.stage ===
                        "Parse PDF and Create Intermediate Representation" &&
                    task.completedPages !== undefined
                ) {
                    return t("page-progress", {
                        progress,
                        current: task.completedPages,
                        total: task.totalPages,
                    });
                }
                if (task.stage === "Check Fonts") {
                    return t("item-progress", { progress, current, total });
                }
                if (task.stage === "Download Fonts") {
                    return `${progress}% (${formatBytes(current)} / ${formatBytes(total)})`;
                }
                return `${progress}% (${current}/${total})`;
            }

            function formatBytes(bytes) {
                const value = Math.max(0, Number(bytes) || 0);
                return `${(value / (1024 * 1024)).toFixed(1)} MB`;
            }

            function formatImportState(task) {
                if (
                    ["pending", "importing", "failed"].includes(
                        task.importState,
                    ) &&
                    !hasImportResult(task)
                )
                    return [
                        "queued",
                        "running",
                        "cancelling",
                        "paused",
                    ].includes(task.status)
                        ? t("await-output")
                        : t("none");
                const mapping = {
                    none: t("none"),
                    pending: t("await-import"),
                    importing: t("importing"),
                    imported: t("imported"),
                    failed: t("import-failed"),
                };
                return (
                    mapping[task.importState] || task.importState || t("none")
                );
            }

            function formatAttempt(task) {
                if (task.attempt === undefined || task.attempt === null) {
                    return "—";
                }
                return String(task.attempt);
            }

            function appendMetric(root, label, value) {
                const item = document.createElement("div");
                item.className = "observability-item";
                const labelEl = document.createElement("div");
                labelEl.className = "metric-label";
                labelEl.textContent = label;
                const valueEl = document.createElement("div");
                valueEl.className = "metric-value";
                valueEl.textContent = value;
                item.appendChild(labelEl);
                item.appendChild(valueEl);
                root.appendChild(item);
                return valueEl;
            }
