            function appendSummaryMetric(root, label, value) {
                const item = document.createElement("span");
                item.className = "metric-summary-item";
                const labelEl = document.createElement("span");
                labelEl.className = "metric-summary-label";
                labelEl.textContent = label;
                const valueEl = document.createElement("span");
                valueEl.className = "metric-summary-value";
                valueEl.textContent = value;
                item.appendChild(labelEl);
                item.appendChild(valueEl);
                root.appendChild(item);
                return {
                    item,
                    value: valueEl,
                    label: labelEl,
                };
            }

            function updateMetricsToggle(button, isExpanded) {
                setAttributeValue(
                    button,
                    "aria-expanded",
                    isExpanded ? "true" : "false",
                );
                setTextContent(
                    button,
                    isExpanded ? t("collapse-details") : t("details"),
                );
            }

            function sanitizeId(value) {
                return String(value).replace(/[^a-zA-Z0-9_-]/g, "-");
            }

            function formatInteger(value) {
                if (value === null || value === undefined) return "—";
                const number = Number(value);
                return Number.isFinite(number)
                    ? Math.round(number).toLocaleString(api.locale || "zh-CN")
                    : "—";
            }

            function formatCompactNumber(value) {
                if (value === null || value === undefined) return "—";
                const number = Number(value);
                if (!Number.isFinite(number)) return "—";
                const absolute = Math.abs(number);
                if (absolute >= 1000000) {
                    return `${stripTrailingZero(number / 1000000)}M`;
                }
                if (absolute >= 1000) {
                    return `${stripTrailingZero(number / 1000)}K`;
                }
                return String(Math.round(number));
            }

            function stripTrailingZero(value) {
                return value.toFixed(1).replace(/\.0$/, "");
            }

            function formatDecimal(value, digits) {
                if (value === null || value === undefined) return "—";
                const number = Number(value);
                return Number.isFinite(number) ? number.toFixed(digits) : "—";
            }

            function formatPercent(value) {
                if (value === null || value === undefined) return "—";
                const number = Number(value);
                return Number.isFinite(number)
                    ? `${(number * 100).toFixed(1)}%`
                    : "—";
            }

            function formatMilliseconds(value) {
                if (value === null || value === undefined) return "—";
                const number = Number(value);
                return Number.isFinite(number)
                    ? `${Math.round(number).toLocaleString(api.locale || "zh-CN")} ms`
                    : "—";
            }

            function formatCompactDuration(value) {
                if (value === null || value === undefined) return "—";
                const milliseconds = Number(value);
                if (!Number.isFinite(milliseconds)) return "—";
                if (milliseconds < 1000) {
                    return `${Math.round(milliseconds)} ms`;
                }
                const seconds = milliseconds / 1000;
                if (seconds < 60) {
                    return `${stripTrailingZero(seconds)} s`;
                }
                const minutes = seconds / 60;
                if (minutes < 60) {
                    return `${stripTrailingZero(minutes)} min`;
                }
                return `${stripTrailingZero(minutes / 60)} h`;
            }

            function formatThroughput(metrics) {
                const value = metrics.throughput?.paragraphsPerMinute;
                if (
                    value === null ||
                    value === undefined ||
                    !Number.isFinite(Number(value))
                )
                    return "—";
                return t("paragraphs-minute", {
                    count: formatDecimal(value, 1),
                });
            }

            function formatEta(metrics) {
                const value = metrics.throughput?.etaSeconds;
                if (value === null || value === undefined) return "—";
                const seconds = Math.max(Math.round(Number(value)), 0);
                if (!Number.isFinite(seconds)) return "—";
                if (seconds < 60) return t("eta-seconds", { seconds });
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60)
                    return t("eta-minutes", { minutes, seconds: seconds % 60 });
                const hours = Math.floor(minutes / 60);
                return t("eta-hours", { hours, minutes: minutes % 60 });
            }

            function getErrorSummary(task) {
                if (api?.errorNotice) {
                    if (task.importState === "failed" || task.importError) {
                        const detail = api.errorNotice({
                            message: task.importError,
                        });
                        return [
                            "error-import-deleted",
                            "error-import-file",
                            "error-timeout",
                        ].includes(detail.id)
                            ? detail.text
                            : api.errorNotice({ code: "import_failed" }).text;
                    }
                    if (
                        task.status === "failed" ||
                        task.error ||
                        task.failedParagraphs?.length ||
                        task.translationSummary?.failed
                    ) {
                        return api.errorNotice({
                            message: [
                                task.error,
                                ...(task.failedParagraphs || []).map(
                                    (p) =>
                                        `${p.providerCode || ""} ${p.errorType || ""} ${p.reason || ""}`,
                                ),
                            ].join(" "),
                            diagnostics: [
                                ...(task.errorDiagnostics || []),
                                ...(task.failedParagraphs || []).map((p) => ({
                                    code: p.validationCode,
                                })),
                            ],
                        }).text;
                    }
                    return "";
                }
                if (task.importState === "failed" || task.importError) {
                    return t("import-error");
                }
                const paragraphs = task.failedParagraphs || [];
                const hasFailure =
                    paragraphs.length > 0 ||
                    task.translationSummary?.failed > 0 ||
                    task.error ||
                    task.status === "failed";
                if (!hasFailure) return "";
                const chatgpt = chatgptFailure(task);
                if (chatgpt) return chatgpt.message;

                const reasons = new Map();
                const addReason = (reason) => {
                    if (reason)
                        reasons.set(reason, (reasons.get(reason) || 0) + 1);
                };
                for (const paragraph of paragraphs) {
                    addReason(
                        translationFailureReason(
                            `${paragraph.providerCode || ""} ${paragraph.errorType || ""} ${paragraph.reason || ""}`,
                        ),
                    );
                }
                addReason(translationFailureReason(task.error || ""));
                const diagnosticReasons = {
                    network_tls: t("error-tls"),
                    llm_client_restricted: t("error-client"),
                    llm_protocol: t("error-protocol"),
                    font_asset_download: t("error-fonts"),
                    pdf_text_layer_cid: t("error-pdf-encoding"),
                    llm_response_shape: t("error-response"),
                    llm_model: t("error-model"),
                    llm_parameters: t("error-parameters"),
                    llm_auth: t("error-auth"),
                    llm_rate_limit: t("error-limit"),
                    output_missing: t("error-output"),
                    invalid_page_range: t("error-pages"),
                };
                for (const diagnostic of task.errorDiagnostics || []) {
                    if (diagnostic.code === "network_connectivity") {
                        addReason(
                            /超时|timeout|timed out/i.test(
                                diagnostic.message || "",
                            )
                                ? t("error-timeout")
                                : t("error-network"),
                        );
                    } else if (
                        Object.prototype.hasOwnProperty.call(
                            diagnosticReasons,
                            diagnostic.code,
                        )
                    ) {
                        addReason(diagnosticReasons[diagnostic.code]);
                    }
                }
                const labels = Array.from(reasons)
                    .sort((a, b) => b[1] - a[1])
                    .map(([reason]) => reason);
                if (!labels.length) return t("error-unknown");
                return t("error-summary", {
                    reasons:
                        labels.slice(0, 2).join(t("error-separator")) +
                        (labels.length > 2 ? t("error-more") : ""),
                });
            }

            function chatgptFailure(task) {
                const text = [
                    task.error,
                    ...(task.errorDiagnostics || []).map((d) => d.code),
                    ...(task.failedParagraphs || []).map(
                        (p) => `${p.providerCode || ""} ${p.reason || ""}`,
                    ),
                ].join(" ");
                if (
                    /chatgpt_sign_in_required|ChatGPT (?:登录已失效|授权已失效|授权无法续期)|请先登录 ChatGPT/.test(
                        text,
                    )
                )
                    return {
                        message: t("login-expired"),
                        requiresLogin: true,
                    };
                if (/暂时无法续期 ChatGPT 授权/.test(text))
                    return {
                        message: t("login-renewal"),
                    };
                if (
                    /chatgpt_usage_limit|ChatGPT 套餐或此应用的用量已达上限/.test(
                        text,
                    )
                )
                    return {
                        message: t("usage-limit"),
                    };
                return undefined;
            }

            function translationFailureReason(value) {
                const rules = [
                    [/insufficient_quota/i, t("error-quota")],
                    [/AuthenticationError|invalid_api_key/i, t("error-auth")],
                    [
                        /PermissionDeniedError|permission_denied/i,
                        t("error-permission"),
                    ],
                    [/model_not_found/i, t("error-model")],
                    [
                        /APITimeoutError|ConnectTimeout|ReadTimeout|TimeoutError|timed out/i,
                        t("error-timeout"),
                    ],
                    [
                        /APIConnectionError|ConnectError|ConnectionError/i,
                        t("error-network"),
                    ],
                    [/InternalServerError/i, t("error-server")],
                    [/RateLimitError|rate_limit_exceeded/i, t("error-limit")],
                    [/semantic_error_unresolved/i, t("error-review")],
                    [/InvalidTranslation/i, t("error-invalid-translation")],
                    [
                        /UnprocessedParagraph|paragraph_not_completed/i,
                        t("error-pending"),
                    ],
                ];
                return (
                    rules.find(([pattern]) => pattern.test(value))?.[1] || ""
                );
            }

            function canDelete(task) {
                if (task.canResume) return true;
                if (
                    task.status === "failed" ||
                    task.status === "incomplete" ||
                    task.status === "cancelled"
                ) {
                    return true;
                }
                return (
                    task.status === "completed" &&
                    task.importState !== "pending" &&
                    task.importState !== "importing"
                );
            }

            function canCancelTask(task) {
                if (!task || !task.canCancel) return false;
                if (task.canResume) return true;
                return (
                    task.status === "queued" ||
                    task.status === "running" ||
                    task.status === "cancelling"
                );
            }

            function canRetry(task) {
                if (task.status === "failed") {
                    return true;
                }
                return (
                    (task.status === "completed" ||
                        (task.status === "incomplete" &&
                            task.canDownloadResult)) &&
                    task.importState === "failed"
                );
            }

            function formatDate(value) {
                if (!value) return "—";
                try {
                    return new Date(value).toLocaleString(
                        api.locale || "zh-CN",
                    );
                } catch (_error) {
                    return value;
                }
            }
            // ]]>
        </script>
