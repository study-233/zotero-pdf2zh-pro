<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>管理翻译配置</title>
        <link rel="stylesheet" href="profileDialogs.css" />
    </head>
    <body>
        <h2>管理翻译配置</h2>
        <p class="hint">
            在设置顶部的下拉框切换当前翻译配置。这里的选择仅用于编辑和管理。
        </p>
        <div
            id="list"
            class="list"
            role="group"
            aria-label="已保存的翻译配置"
        />
        <div class="toolbar">
            <button id="add">新增</button><button id="edit">编辑</button
            ><button id="copy">复制</button><button id="remove">删除</button
            ><button id="top">置顶</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite" />
        <footer><button id="close">关闭</button></footer>
        <script charset="utf-8" src="profileManager.js" />
    </body>
</html>
