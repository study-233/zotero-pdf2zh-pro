[package]
name = "pdf2zh-slint-probe"
version = "1.8.2"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "pdf2zh-slint-probe"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-skia", "accessibility", "raw-window-handle-06"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
